<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>各駅停車</title>
<meta name="description" content="每天一站学日语：五十音、N5 词卡、语法闯关和每日打卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f5f8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="各駅停車">
<script src="audio-k.js" async></script>
<script src="audio-w.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<style>
/* 版式概念：一条环线电车。首页是站名牌，课程是一站，完成后盖站台纪念章。 */
:root {
  --paper: #f4f7f3; --plate: #ffffff; --ink: #17241c; --ink-2: #4a5a50; --ink-3: #7c8b82; --rule: #dbe3d8;
  --line: #80b918; --line-deep: #39740f; --line-soft: #e7f2d0; --on-deep: #ffffff;
  --stamp: #c8352b; --stamp-soft: #fbe6e2;
  --h1: #dcecc0; --h2: #a9d468; --h3: #6fa72a; --h4: #39740f; --on-h4: #ffffff;
  --u0: #c8352b; --u1: #24509a; --u2: #2c7a4b; --u3: #8a3a8f; --u4: #b06a00;
  /* 蓝色圆珠笔和黄色荧光笔：注音用笔，常错的假名用荧光笔涂一下 */
  --pen: #1c5fa8; --mark: #ffe97a;
  /* 声调线：高音红，低音蓝 */
  --p-hi: #d23b2f; --p-lo: #2f6fbf;
  /* 校园笔记本：白纸、淡蓝横线、左侧红色边线 */
  --nb: #fdfefe; --nb-dot: #dfe8ef; --nb-rule: #cddfee; --nb-edge: #efb3ab; --nb-ink: #1b2a33; --stick: #fff4b8; --stick-ink: #3b3512;
  /* 发车案内和车票：不随主题变化的实物颜色 */
  --board: #0f1c17; --board-ink: #eef4ee; --board-dim: #8fa398; --led: #ffb52e; --led-ok: #7be09a;
  --ticket: #e4f1dc; --ticket-dot: #bcd9ad; --ticket-ink: #20402a;
  --r: 6px;
  --zh: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --ja: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --num: "Barlow Condensed", "DIN Alternate", "Arial Narrow", sans-serif;
  --kf: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1512; --plate: #18211c; --ink: #e8efe8; --ink-2: #a9b6ae; --ink-3: #76847c; --rule: #2a352e;
    --line: #9bcb2c; --line-deep: #a9d83f; --line-soft: #222f18; --on-deep: #10190c;
    --stamp: #f0735f; --stamp-soft: #3a201c;
    --h1: #2a3d1c; --h2: #4d7a24; --h3: #7bb12f; --h4: #b5e05a; --on-h4: #10190c;
    --u0: #f0735f; --u1: #7fa8ee; --u2: #6cc792; --u3: #d08ad4; --u4: #e7ad4a;
    --pen: #8cc6f7; --mark: #6a5a10;
    --p-hi: #ff8a78; --p-lo: #7fb6f2;
    --nb: #151c20; --nb-dot: #232f37; --nb-rule: #2a3843; --nb-edge: #6a3a35; --nb-ink: #e2eaef; --stick: #3a3516; --stick-ink: #f3ecc4;
    --ticket: #1d2b1f; --ticket-dot: #2f4531; --ticket-ink: #d3e6d3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1512; --plate: #18211c; --ink: #e8efe8; --ink-2: #a9b6ae; --ink-3: #76847c; --rule: #2a352e;
  --line: #9bcb2c; --line-deep: #a9d83f; --line-soft: #222f18; --on-deep: #10190c;
  --stamp: #f0735f; --stamp-soft: #3a201c;
  --h1: #2a3d1c; --h2: #4d7a24; --h3: #7bb12f; --h4: #b5e05a; --on-h4: #10190c;
  --u0: #f0735f; --u1: #7fa8ee; --u2: #6cc792; --u3: #d08ad4; --u4: #e7ad4a;
  --pen: #8cc6f7; --mark: #6a5a10;
  --p-hi: #ff8a78; --p-lo: #7fb6f2;
  --nb: #151c20; --nb-dot: #232f37; --nb-rule: #2a3843; --nb-edge: #6a3a35; --nb-ink: #e2eaef; --stick: #3a3516; --stick-ink: #f3ecc4;
  --ticket: #1d2b1f; --ticket-dot: #2f4531; --ticket-ink: #d3e6d3;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--zh); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; border-radius: 6px; }
[lang="ja"], .ja { font-family: var(--ja); }
ruby { ruby-position: over; ruby-align: center; }
rt { font-size: .5em; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.no-furi rt { display: none; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }

.shell { max-width: 1020px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 104px; }
.top { display: flex; align-items: center; gap: 16px; padding-block: 4px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--ja); font-weight: 900; font-size: 18px; letter-spacing: .08em; }
.brand i { width: 12px; height: 12px; border: 3px solid var(--line); border-radius: 50%; }
.top-stats { margin-left: auto; display: flex; align-items: baseline; gap: 12px; color: var(--ink-2); font-size: 13px; }
.top-stats b { font-family: var(--num); font-size: 21px; color: var(--ink); margin-right: 1px; font-weight: 600; }
.top-stats em { font-style: normal; }
.fire svg { width: 15px; height: 15px; vertical-align: -1px; margin-right: 2px; color: var(--ink-3); }
.fire.lit svg { color: var(--stamp); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--plate); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { position: relative; padding: 8px 0 7px; font-size: 11px; color: var(--ink-3); display: grid; justify-items: center; gap: 1px; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--line-deep); font-weight: 600; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: 22%; right: 22%; top: -1px; height: 3px; background: var(--line); }

/* 站名牌 */
.sign { background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.sign-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 22px 20px 12px; }
.code { display: grid; justify-items: center; width: 54px; height: 54px; border: 4px solid var(--line); border-radius: 6px; font-family: var(--num); font-weight: 600; line-height: 1; padding-top: 5px; background: var(--plate); }
.code span { font-size: 13px; letter-spacing: .08em; }
.code b { font-size: 25px; font-weight: 600; }
.sign-name { min-width: 0; text-align: center; }
.sign-name h1 { font-family: var(--ja); font-weight: 900; font-size: clamp(30px, 8vw, 46px); letter-spacing: .1em; line-height: 1.2; overflow-wrap: anywhere; }
.sign-name p { color: var(--ink-2); font-size: 14px; }
.sign-name .sign-ro { font-family: var(--num); font-weight: 500; font-size: 15px; letter-spacing: .14em; text-transform: capitalize; color: var(--ink-2); line-height: 1.2; }
.sign-cta { padding: 0 20px 18px; }
.link { color: var(--line-deep); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.sign-band { position: relative; height: 16px; background: var(--line); }
.sign-band::after { content: ""; position: absolute; left: 38%; right: 38%; top: 0; bottom: 0; background: var(--line-deep); }
.sign-band i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; background: var(--plate); z-index: 1; }
.sign-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 12px; padding: 8px 20px 12px; font-size: 13px; color: var(--ink-2); }
.sign-foot span:last-child { text-align: right; }
.sign-foot b { display: block; font-family: var(--ja); font-weight: 700; color: var(--ink); font-size: 14px; }
.sound { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--rule); color: var(--line-deep); flex: none; background: var(--plate); }
.sound:hover { background: var(--line-soft); }
.sound svg { width: 20px; height: 20px; fill: currentColor; }

.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
@media (min-width: 860px) { .grid.home { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }

.panel { background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; color: var(--ink-3); }
.plan { list-style: none; margin: 8px 0 14px; padding: 0; display: grid; }
.plan li { border-top: 1px solid var(--rule); }
.plan li button { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding-block: 9px; text-align: left; }
.plan li button:disabled { cursor: default; }
.plan li:first-child { border-top: 0; }
.plan .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--rule); justify-self: center; }
.plan .on .dot { border-color: var(--line); }
.plan .ok .dot { background: var(--line); border-color: var(--line); }
.plan small { color: var(--ink-3); font-size: 13px; }
.btn { display: block; width: 100%; padding: 14px 18px; background: var(--line-deep); color: var(--on-deep); font-weight: 700; font-size: 17px; border-radius: var(--r); text-align: center; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { background: var(--rule); color: var(--ink-3); cursor: default; filter: none; }
.btn.ghost { background: none; color: var(--line-deep); border: 1px solid var(--rule); font-weight: 600; font-size: 15px; }
.btn.stop { background: var(--stamp); color: var(--plate); }
.stack { display: grid; gap: 8px; }

.streak-num { font-family: var(--num); font-weight: 600; font-size: 38px; line-height: 1; }

/* 线路 */
.unit { margin: 22px 0 6px; }
.unit:first-child { margin-top: 0; }
.unit h2 { font-size: 15px; font-weight: 600; }
.unit h2 .ja { font-weight: 700; margin-left: 6px; }
.unit p { font-size: 13px; color: var(--ink-3); }
.rail { position: relative; display: grid; }
.st { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding-block: 10px; }
.st::before { content: ""; position: absolute; left: 17px; top: 0; bottom: 0; width: 6px; background: var(--rule); }
.st.done::before { background: var(--line); }
.st .node { position: relative; width: 22px; height: 22px; margin-left: 9px; border-radius: 50%; background: var(--plate); border: 5px solid var(--rule); }
.st.done .node { border-color: var(--line); }
.st.cur .node { border-color: var(--line-deep); }
.st b { font-family: var(--ja); font-weight: 700; display: block; line-height: 1.3; }
.st small { color: var(--ink-3); font-size: 13px; }
.st .tag { font-family: var(--num); font-size: 15px; color: var(--ink-3); }
.st.locked b { color: var(--ink-3); }
.st.cur { background: var(--line-soft); }
.line-wrap { max-width: 620px; }

/* 词本 */
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.field { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--plate); }
.chip { padding: 8px 12px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 14px; color: var(--ink-2); background: var(--plate); }
.chip[aria-pressed="true"] { background: var(--line-deep); border-color: var(--line-deep); color: var(--on-deep); }
.wlist { display: grid; }
@media (min-width: 760px) { .wlist { grid-template-columns: 1fr 1fr; column-gap: 28px; } }
.w { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.w b { font-family: var(--ja); font-weight: 700; font-size: 18px; }
.w small { display: block; color: var(--ink-2); font-size: 13px; }
.bars { display: flex; gap: 2px; }
.bars i { width: 4px; height: 14px; background: var(--rule); }
.bars i.on { background: var(--line); }
.w .sound { width: 36px; height: 36px; }
details.g { border-bottom: 1px solid var(--rule); padding-block: 10px; }
details.g summary { cursor: pointer; font-weight: 600; font-family: var(--ja); }
details.g small { color: var(--ink-3); font-family: var(--zh); font-weight: 400; margin-left: 8px; }
.empty { color: var(--ink-2); padding: 32px 0; }

/* 印章帖 */
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.slot { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border: 1px dashed var(--rule); border-radius: 50%; color: var(--ink-3); font-family: var(--num); font-size: 18px; }
.slot.has { border: 0; }
.stamp { width: 100%; height: 100%; display: block; }
.stamp text { fill: currentColor; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; }
.stats b { display: block; font-family: var(--num); font-weight: 600; font-size: 30px; line-height: 1.1; }
.stats span { font-size: 13px; color: var(--ink-2); }
@media (min-width: 860px) { .grid.book { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; } }
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--rule); }
.set:first-of-type { border-top: 0; }
.set small { display: block; color: var(--ink-3); font-size: 13px; }
.switch { width: 46px; height: 26px; border-radius: 13px; background: var(--rule); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--plate); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--line-deep); }
.switch[aria-checked="true"]::after { left: 23px; }

/* 导师 */
.panel .btn + .btn, .tutor .btn + .btn { margin-top: 8px; }
.tutor { max-width: 680px; display: grid; gap: 12px; }
.tutor > * { min-width: 0; }
.tu-tabs { flex-wrap: nowrap; gap: 20px; margin-bottom: 14px; overflow-x: auto; border-bottom: 1px solid var(--rule); scrollbar-width: none; }
.tu-tabs .chip { flex: none; padding: 8px 1px 9px; margin-bottom: -1px; font-size: 15px; color: var(--ink-3); background: none; border: 0; border-bottom: 2.5px solid transparent; border-radius: 0; }
.tu-tabs .chip[aria-pressed="true"] { color: var(--ink); font-weight: 700; background: none; border-bottom-color: var(--line); }
.chip:disabled { opacity: .55; cursor: default; }
.chip.stop { justify-self: start; color: var(--stamp); border-color: var(--stamp); }
.lead { color: var(--ink-2); font-size: 15px; text-wrap: pretty; }
.tutor .tools { margin-bottom: 0; }
.row { display: flex; gap: 8px; }
.row .field { flex: 1 1 auto; }
.row .btn { width: auto; flex: none; padding: 10px 16px; font-size: 15px; }
.rich { display: grid; gap: 8px; }
.rich > * { min-width: 0; }
.rich:empty { display: none; }
.rich h3 { font-size: 17px; margin-top: 10px; text-wrap: pretty; }
.rich p { text-wrap: pretty; overflow-wrap: anywhere; }
.rich .li { position: relative; padding-left: 14px; }
.rich .li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.rich .chip { white-space: nowrap; }
.think { color: var(--ink-3); font-size: 15px; }
.tu-note { color: var(--stamp); font-size: 14px; }
.tiny { color: var(--ink-3); font-size: 12px; text-wrap: pretty; }
.talk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-2); font-size: 14px; }
.tutor .bub { display: block; }
.fix { display: grid; gap: 2px; padding: 10px 12px; background: var(--stamp-soft); border-left: 3px solid var(--stamp); }
.fix small { color: var(--ink-2); font-size: 12px; margin-top: 6px; }
.fix small:first-child { margin-top: 0; }
.fix p, .fix b { overflow-wrap: anywhere; }
.fix b { font-family: var(--ja); font-weight: 700; font-size: 18px; line-height: 1.8; }
.fix-l { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.fix .sound { width: 36px; height: 36px; }
.hint { justify-self: start; max-width: 88%; text-align: left; padding: 8px 12px; border: 1px dashed var(--line-deep); border-radius: var(--r); }
.hint small { display: block; color: var(--ink-2); font-size: 13px; }
.hint b { display: block; font-family: var(--ja); font-weight: 500; line-height: 1.8; }
.composer { position: sticky; bottom: calc(61px + env(safe-area-inset-bottom, 0px)); padding-block: 8px; background: var(--paper); }
@media (min-width: 760px) { .composer { bottom: 0; } }

/* 五十音 */
.kf { font-family: var(--kf); font-weight: 600; font-style: normal; }
.big .kf { font-weight: 600; }
.lead.center { text-align: center; }
@media (max-width: 859px) { .kpath > aside, .n5v > aside { order: -1; } }
.kbar { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 8px; font-size: 14px; }
.kbar div { height: 8px; background: var(--rule); }
.kbar u { display: block; height: 100%; background: var(--line); }
.kbar b { font-family: var(--num); font-size: 16px; font-weight: 600; }
.kchart { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 40px; gap: 5px; align-items: center; max-width: 560px; }
.kchart .sound { width: 36px; height: 36px; justify-self: end; }
.kc { display: grid; justify-items: center; align-content: center; min-height: 58px; padding: 3px 0; background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); }
.kc .kf { font-size: 24px; line-height: 1.25; }
.kc small { font-size: 12px; color: var(--ink-3); line-height: 1.1; }
.kc.s1 { background: var(--stamp-soft); border-color: transparent; }
.kc.s2 { background: var(--line-soft); border-color: transparent; }
.kc.s3 { background: var(--line); border-color: transparent; }
.kc.s3 .kf, .kc.s3 small { color: #10190c; }
.kc.play { outline: 3px solid var(--line-deep); outline-offset: 1px; }
.kc.hot { box-shadow: inset 0 -5px 0 var(--mark); }
.k-ctl { display: grid; gap: 8px; margin-bottom: 12px; max-width: 560px; }
.k-tools { display: flex; gap: 18px; padding-inline: 2px; }
.k-tools button { font-size: 14px; color: var(--ink-2); }
.k-tools button[aria-pressed="true"] { color: var(--pen); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.k-tip { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.k-mark { justify-self: start; }
.kplays { display: grid; gap: 8px; }
@media (min-width: 600px) { .kplays { grid-template-columns: 1fr 1fr; } }
.kplay { display: block; padding: 12px 14px; text-align: left; background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); }
.kplay:hover { border-color: var(--line); }
.kplay.pen { border-left: 4px solid var(--line-deep); }
.kplay b { display: block; font-size: 16px; }
.kplay small { color: var(--ink-2); font-size: 13px; }
.kdoc { max-width: 680px; display: grid; gap: 22px; }
.kh > h2 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.kh h3 { font-size: 15px; margin-block: 14px 6px; }
.kh p { text-wrap: pretty; margin-top: 6px; }
.kh details.g summary { font-family: var(--zh); }
.ktable { width: 100%; border-collapse: collapse; }

/* 课程 */
.ses { position: fixed; inset: 0; z-index: 10; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); }
.ses-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); max-width: 680px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.x { width: 40px; height: 40px; font-size: 22px; color: var(--ink-2); line-height: 1; }
.track { position: relative; height: 6px; background: var(--rule); margin-right: 26px; }
.ro-btn { font-size: 12px; color: var(--pen); padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r); white-space: nowrap; }
.track u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--line); transition: width .3s; }
.track svg { position: absolute; top: -12px; width: 30px; height: 18px; margin-left: -4px; color: var(--line-deep); transition: left .3s; }
.ses-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ses-in { max-width: 620px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.ses-foot { border-top: 1px solid var(--rule); background: var(--plate); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ses-foot > div { max-width: 588px; margin: 0 auto; display: grid; gap: 10px; }
.ses-foot.good { background: var(--line-soft); }
.ses-foot.bad { background: var(--stamp-soft); }
.verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.verdict b { display: block; font-size: 17px; }
.good .verdict b { color: var(--line-deep); }
.bad .verdict b { color: var(--stamp); }
.verdict p { font-size: 15px; }
.tag-l { font-size: 13px; color: var(--ink-3); letter-spacing: .06em; }
.big { font-family: var(--ja); font-weight: 900; font-size: clamp(38px, 11vw, 60px); line-height: 1.35; text-align: center; overflow-wrap: anywhere; }
.big.mid { font-size: clamp(26px, 7vw, 36px); font-weight: 700; }
.card { display: grid; gap: 6px; justify-items: center; text-align: center; padding-block: 24px; }
.card .read { font-family: var(--ja); font-size: 20px; color: var(--ink-2); }
.card .mean { font-size: 20px; }
.card .roma { font-family: var(--num); font-size: 18px; letter-spacing: .06em; color: var(--ink-3); }
.card-btns { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.learn { display: grid; gap: 6px; padding: 14px 16px; background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); }
.learn p { text-wrap: pretty; font-size: 15px; }
.learn .eyebrow:not(:first-child) { margin-top: 8px; }
.learn .li { position: relative; padding-left: 14px; color: var(--ink-2); }
.learn .li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.beats { display: flex; flex-wrap: wrap; gap: 4px; }
.beats span { display: grid; justify-items: center; min-width: 38px; padding: 4px 6px; font-size: 20px; font-weight: 700; line-height: 1.3; background: var(--line-soft); border-radius: var(--r); }
.beats i { font-family: var(--num); font-style: normal; font-weight: 500; font-size: 13px; line-height: 1; color: var(--pen); min-height: 13px; }
.ask, .idk { justify-self: center; padding: 8px 12px; font-size: 15px; color: var(--line-deep); text-decoration: underline; text-underline-offset: 3px; }
.idk { color: var(--ink-2); }
.teach { padding-inline: 2px; }
.rule h2 { font-family: var(--ja); font-weight: 900; font-size: 24px; line-height: 1.35; }
.rule .m { font-family: var(--ja); font-weight: 700; color: var(--line-deep); white-space: pre-line; margin-top: 6px; font-size: 17px; }
.rule .note { color: var(--ink-2); margin-top: 10px; }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--rule); width: 100%; text-align: left; }

.ex small { color: var(--ink-2); font-size: 14px; }

.q { font-size: 20px; font-weight: 600; line-height: 1.8; }
.q.jp { font-family: var(--ja); font-size: 24px; font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { padding: 12px 14px; min-height: 54px; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--plate); text-align: left; font-size: 18px; line-height: 1.6; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.opt kbd { font-family: var(--num); font-size: 13px; color: var(--ink-3); flex: none; }
.opt:hover:enabled { border-color: var(--line); }
.opt.right { border-color: var(--line-deep); background: var(--line-soft); }
.opt.wrong { border-color: var(--stamp); background: var(--stamp-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .ja { font-weight: 500; }
.tray { min-height: 66px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding-block: 8px; border-bottom: 2px solid var(--rule); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 8px; }
.tile { padding: 8px 12px; min-height: 44px; border: 1.5px solid var(--rule); border-bottom-width: 3px; border-radius: var(--r); background: var(--plate); font-family: var(--ja); font-size: 18px; font-weight: 500; line-height: 1.7; }
.tile:disabled { visibility: hidden; }
.listen { justify-self: center; width: 84px; height: 84px; }

.talk { display: grid; gap: 10px; }
.bub { max-width: 88%; justify-self: start; text-align: left; padding: 8px 12px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--plate); }

.arrive { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 16px; }

.press { width: min(220px, 60vw); aspect-ratio: 1; max-width: 100%; }
@media (prefers-reduced-motion: no-preference) {
  .press { animation: press .42s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes press { from { transform: scale(1.7) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { .track u, .track svg, .switch::after { transition: none; } }
.result { display: flex; justify-content: center; gap: 28px; }
.result div { text-align: center; }
.result b { display: block; font-family: var(--num); font-size: 30px; font-weight: 600; line-height: 1.1; }
.result span { font-size: 13px; color: var(--ink-2); }
.modal { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: grid; place-items: center; padding: 16px; z-index: 2; }
.modal > div { background: var(--plate); border-radius: var(--r); padding: 20px; width: min(340px, 100%); display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }

@media (min-width: 760px) {
  .nav { position: static; display: flex; gap: 2px; background: none; border: 0; padding: 0; margin-left: auto; }
  .nav button { padding: 6px 12px; font-size: 15px; display: flex; align-items: center; gap: 6px; border-radius: var(--r); }
  .nav svg { width: 20px; height: 20px; }
  .nav button[aria-current="page"] { background: var(--line-soft); }
  .nav button[aria-current="page"]::before { display: none; }
  .top-stats { margin-left: 0; order: 3; }
  .shell { padding-bottom: 32px; }

}

/* 个人条 */
.me { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; }
.me-av { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--line-soft); color: var(--line-deep); font-family: var(--ja); font-weight: 900; font-size: 22px; }
.me-top { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.me-top b { font-size: 17px; overflow-wrap: anywhere; }
.me-top > span { font-size: 13px; color: var(--ink-2); }
.me-bar { height: 8px; margin-block: 6px 4px; border-radius: var(--r); background: var(--rule); overflow: hidden; }
.me-bar u { display: block; height: 100%; border-radius: var(--r); background: var(--line); transition: width .4s; }

.me-fire.lit svg { color: var(--stamp); }
.me-fire b { font-family: var(--num); font-size: 26px; font-weight: 600; color: var(--ink); }
.me-fire small { font-size: 12px; }

/* 三条学习线 */
.entries { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.entry { display: grid; align-content: start; gap: 2px; padding: 12px; text-align: left; background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); transition: transform .12s, border-color .12s; }
.entry:hover { border-color: var(--line); }
.entry:active { transform: scale(.96); }
.e-mark { font-size: 30px; font-weight: 900; line-height: 1.2; color: var(--line-deep); }
.entry b { font-size: 15px; line-height: 1.3; }
.entry small { font-size: 12px; line-height: 1.35; color: var(--ink-3); overflow-wrap: anywhere; }

/* 打卡 */
.ck-top { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.ring { width: 72px; height: 72px; }
.ring circle { fill: none; stroke: var(--rule); stroke-width: 7; }
.ring .v { stroke: var(--line); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 30px 30px; transition: stroke-dasharray .4s; }
.ring text { font-family: var(--num); font-size: 15px; font-weight: 600; fill: var(--ink); }
.ck-n { display: block; font-size: 22px; line-height: 1.3; }
.ck p { font-size: 14px; color: var(--ink-2); text-wrap: pretty; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.hc { display: block; aspect-ratio: 1; border-radius: var(--r); background: var(--paper); border: 1px solid var(--rule); }
.hc.h1 { background: var(--h1); border-color: transparent; }
.hc.h2 { background: var(--h2); border-color: transparent; }
.hc.h3 { background: var(--h3); border-color: transparent; }
.hc.h4 { background: var(--h4); border-color: transparent; }
.hc.hf { background: none; border: 2px dashed var(--line); }
.hc.now { outline: 2px solid var(--ink-2); outline-offset: 1px; }
.heat-key { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
.heat-key span:first-child { margin-right: auto; }
.heat-key .hc { width: 12px; height: 12px; aspect-ratio: auto; }
.ck-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.wod-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-block: 6px; }
.wod-row b { display: block; font-family: var(--ja); font-size: 26px; line-height: 1.5; }
.wod-row small { color: var(--ink-2); }
.gain { display: grid; gap: 6px; width: 100%; margin-top: 16px; padding: 12px 14px; background: var(--line-soft); border-radius: var(--r); text-align: left; }
.gain p { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; font-size: 15px; text-wrap: pretty; }
.gain b { color: var(--line-deep); }

/* 翻转词卡 */
.fc { display: grid; margin-top: 8px; perspective: 1200px; cursor: pointer; }
.fc-in { position: relative; display: grid; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, .7, .3, 1); }
.fc.on .fc-in { transform: rotateY(180deg); }
.fc-f, .fc-b { grid-area: 1 / 1; display: grid; gap: 6px; justify-items: center; align-content: center; min-height: 340px; padding: 20px 16px; text-align: center; background: var(--plate); border: 1px solid var(--rule); border-radius: 8px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fc-b { transform: rotateY(180deg); }
.fc-f small { color: var(--ink-3); font-size: 14px; }
.fc-b .read { font-family: var(--ja); font-size: 24px; font-weight: 700; }
.fc-b .roma { font-family: var(--num); font-size: 18px; letter-spacing: .06em; color: var(--ink-3); }
.fc-b .mean { font-size: 20px; }
.fc-b .ex { width: 100%; text-align: left; }
.fc-pos { font-size: 13px; color: var(--ink-3); }
.big.sm { font-size: clamp(30px, 8vw, 44px); }
.fc.fly-l { animation: fly-l .32s ease-in forwards; }
.fc.fly-r { animation: fly-r .32s ease-in forwards; }
.fc.fly-d { animation: fly-d .32s ease-in forwards; }
@keyframes fly-l { to { transform: translate(-120%, -4%) rotate(-12deg); opacity: 0; } }
@keyframes fly-r { to { transform: translate(120%, -4%) rotate(12deg); opacity: 0; } }
@keyframes fly-d { to { transform: translateY(40%); opacity: 0; } }
.fcg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fcg .opt { display: grid; justify-items: center; gap: 0; padding: 8px 4px; }
.fcg b { font-size: 16px; }
.fcg small { font-size: 12px; color: var(--ink-3); }
.fcg .g0 b { color: var(--stamp); }
.fcg .g2 b { color: var(--line-deep); }
.ses-body { overflow-x: hidden; }

/* 语法闯关 */
.g-form { margin-top: 8px; padding: 8px 10px; background: var(--line-soft); border-radius: var(--r); font-size: 15px; font-weight: 700; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars i { width: 14px; height: 14px; background: var(--rule); clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 98%, 50% 76%, 20% 98%, 30% 60%, 0 38%, 38% 35%); }
.stars i.on { background: var(--u4); }
.arrive .stars i { width: 28px; height: 28px; }

/* 掌握度 */
.mbar { display: flex; gap: 2px; height: 14px; margin-top: 10px; border-radius: var(--r); overflow: hidden; }
.mbar i { display: block; min-width: 4px; }
.m-good { background: var(--h4); }
.m-doing { background: var(--h2); }
.m-none { background: var(--rule); }
.mkey { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.mkey i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 3px; }
.mkey b { font-family: var(--num); font-size: 16px; font-weight: 600; color: var(--ink); }

/* 日历和成就 */
.cal-top { display: flex; justify-content: space-between; align-items: center; margin-block: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; justify-items: center; text-align: center; }
.cal i { font-style: normal; font-size: 12px; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) {

}

/* 注音：蓝色圆珠笔写在假名下面 */

.u { display: inline-flex; flex-direction: column; align-items: center; vertical-align: baseline; }

.u > i { font-family: var(--num); font-style: normal; font-weight: 500; font-size: max(.56em, 11px); line-height: 1; letter-spacing: .01em; color: var(--pen); margin-top: -.1em; }

.big .u > i { font-size: .34em; margin-top: 0; }
.st-ro { font-family: var(--num); letter-spacing: .04em; }

/* 分段选择 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; background: var(--rule); border-radius: var(--r); }
.seg button { padding: 8px 6px; font-size: 14px; color: var(--ink-2); border-radius: 4px; }
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--ink); font-weight: 600; }
.set-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }

/* 假名小卡 */
.sheet-bg { position: fixed; inset: 0; z-index: 29; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 30; transform: translateX(-50%); display: grid; gap: 12px; width: min(560px, 100%); max-height: 86dvh; overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--plate); border-radius: 14px 14px 0 0; }
.sheet-top { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-right: 30px; }
.sheet-g { display: grid; place-items: center; width: 76px; height: 76px; font-size: 52px; line-height: 1; background-color: var(--nb); background-image: linear-gradient(var(--nb-rule), var(--nb-rule)), linear-gradient(var(--nb-rule), var(--nb-rule)); background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat; border: 1px solid var(--nb-rule); }
.sheet-ro b { display: block; font-family: var(--num); font-size: 34px; font-weight: 600; line-height: 1; color: var(--pen); }
.sheet-ro small { color: var(--ink-3); font-size: 13px; }
.sheet-pic { font-size: 15px; text-wrap: pretty; }
.sheet-note { font-size: 13px; color: var(--ink-3); margin-bottom: -8px; }
.sheet textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); color: var(--pen); font: inherit; resize: vertical; }
.sheet-x { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; font-size: 22px; color: var(--ink-3); }

/* 发车案内：车站的出发显示屏 */
.board { background: var(--board); color: var(--board-ink); border-radius: var(--r); overflow: hidden; }
.board header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px 8px; border-bottom: 1px solid color-mix(in srgb, var(--board-ink) 16%, transparent); }
.board header b { font-family: var(--ja); font-weight: 700; font-size: 15px; letter-spacing: .24em; }
.board header span { font-size: 12px; color: var(--board-dim); letter-spacing: .1em; }
.board ul { list-style: none; margin: 0; padding: 0; }
.board li + li { border-top: 1px solid color-mix(in srgb, var(--board-ink) 9%, transparent); }
.board li button { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; color: inherit; text-align: left; }
.board li button:hover:enabled { background: color-mix(in srgb, var(--board-ink) 6%, transparent); }
.board li button:disabled { cursor: default; }
.b-k { padding: 2px 0; font-size: 12px; font-weight: 700; text-align: center; border-radius: 3px; color: var(--board); background: var(--board-ink); }
.b-k.b0 { background: #ffb52e; }

.board li.ok .b-s { color: var(--led-ok); }
.board li.ok .b-t, .board li.ok .b-k { opacity: .55; }

/* 今日要记：做成一张车票，左上角切角 */
.memo { display: grid; gap: 8px; width: 100%; padding: 14px 16px; text-align: left; color: var(--ticket-ink); background-color: var(--ticket); background-image: radial-gradient(circle at 1px 1px, var(--ticket-dot) 1px, transparent 1.3px); background-size: 7px 7px; clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%, 0 16px); border-radius: 0 var(--r) var(--r) var(--r); transition: transform .12s; }
.memo:active { transform: scale(.98); }

.memo-top small { font-family: var(--num); font-size: 19px; font-weight: 600; }
.memo-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 16px; font-weight: 700; }
.memo-list .kf { font-size: 22px; font-weight: 600; }
.memo-go { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

/* 打卡里的等级 */
.ck-lv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.ck-lv .me-bar { margin: 0; }
.ck-lv small { color: var(--ink-3); font-size: 12px; }

/* 笔记本 */
.nb { display: grid; color: var(--nb-ink); background-color: var(--nb); background-image: radial-gradient(circle at 1px 1px, var(--nb-dot) .8px, transparent 1px); background-size: 18px 18px; border: 1px solid var(--rule); border-radius: var(--r); box-shadow: 0 1px 1px color-mix(in srgb, var(--ink) 6%, transparent), 0 10px 26px -14px color-mix(in srgb, var(--ink) 30%, transparent); overflow: hidden; }
.nb-page { display: grid; align-content: start; gap: 22px; min-width: 0; padding: 18px 16px 22px; }
.nb-head { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; padding-bottom: 12px; border-bottom: 2px solid var(--nb-ink); }
.nb-title h1 { font-family: var(--ja); font-weight: 900; font-size: 26px; letter-spacing: .08em; line-height: 1.2; }

.nb-no span { display: flex; align-items: baseline; gap: 6px; }
.nb-no b { min-width: 34px; font-size: 19px; font-weight: 500; text-align: center; color: var(--pen); border-bottom: 1px solid var(--nb-rule); font-variant-numeric: tabular-nums; }
.nb-no .nb-w { min-width: 0; font-family: var(--ja); font-size: 14px; border: 0; }
.nb-stamp { position: absolute; right: 86px; top: -2px; display: grid; place-items: center; width: 46px; height: 46px; color: var(--stamp); border: 2px solid currentColor; border-radius: 50%; font-family: var(--ja); font-weight: 900; font-size: 22px; transform: rotate(-12deg); opacity: .82; }
.nb-sec { display: grid; gap: 10px; min-width: 0; }
.nb-sec h2 { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 700; }
.nb-sec h2 span { padding: 0 4px; background: linear-gradient(transparent 56%, color-mix(in srgb, var(--line) 42%, transparent) 56%); }
.nb-sec h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; }
.nb-none { font-size: 14px; color: var(--ink-3); }
.pen { color: var(--pen); }
.nks { display: grid; gap: 12px; }
.nk { display: grid; grid-template-columns: 62px minmax(0, 1fr) 26px; gap: 12px; align-items: start; }
.nk-g { display: grid; place-items: center; width: 62px; height: 62px; font-size: 40px; line-height: 1; color: var(--nb-ink); background-color: var(--nb); background-image: linear-gradient(var(--nb-rule), var(--nb-rule)), linear-gradient(var(--nb-rule), var(--nb-rule)); background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat; border: 1px solid var(--nb-edge); }
.nk-t { min-width: 0; }
.nk-t b { display: block; font-family: var(--num); font-size: 21px; font-weight: 600; line-height: 1.1; }
.nk-t p { font-size: 13px; line-height: 1.5; color: var(--ink-2); text-wrap: pretty; }
.nk-t p.pen { color: var(--pen); }
.tick { position: relative; width: 26px; height: 26px; border: 1.5px solid var(--nb-rule); border-radius: 50%; background: var(--nb); flex: none; }
.tick[aria-checked="true"] { border-color: var(--pen); }
.tick[aria-checked="true"]::after { content: ""; position: absolute; left: 7px; top: 2px; width: 8px; height: 15px; border: solid var(--pen); border-width: 0 2.5px 2.5px 0; transform: rotate(40deg); }
.nk.ok .nk-g, .nk.ok .nk-t, .nw.ok .nw-m, .nw.ok .nw-z { opacity: .45; }
.nws { display: grid; }
.nw { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--nb-rule); }
.nw:last-child { border-bottom: 1px solid var(--nb-rule); }
.nw-m { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; min-width: 0; }
.nw-m b { font-family: var(--ja); font-weight: 700; font-size: 18px; line-height: 1.7; }
.nw-m > span { font-family: var(--num); font-size: 15px; letter-spacing: .02em; }
.nw-z { grid-column: 2; grid-row: 2; font-size: 14px; color: var(--ink-2); }
.nw-a { grid-column: 3; grid-row: 1 / 3; display: flex; align-items: center; gap: 4px; }
.nw-a .sound { width: 34px; height: 34px; background: none; border: 0; }

.pencil svg { width: 19px; height: 19px; }
.pencil.has { color: var(--pen); }
.nw-note, .nw-in { grid-column: 2 / -1; font-size: 14px; }
.nw-in { width: 100%; padding: 6px 8px; color: var(--pen); background: transparent; border: 0; border-bottom: 1.5px solid var(--pen); border-radius: 0; }
.nw-in:focus-visible { outline: none; }
.stick { display: grid; gap: 4px; padding: 14px; color: var(--stick-ink); background: var(--stick); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 16%, transparent); }
.stick-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.stick small { font-size: 12px; opacity: .75; }
.stick h3 { font-family: var(--ja); font-weight: 900; font-size: 21px; line-height: 1.5; }
.stick-m { font-weight: 700; font-size: 15px; }
.stick-f { font-size: 13px; opacity: .85; }
.stick .ex { border-top: 1px dashed color-mix(in srgb, var(--stick-ink) 30%, transparent); margin-top: 6px; }
.stick .ex small { color: inherit; opacity: .8; }
.stick rt { color: inherit; }
.stick .sound { background: transparent; border-color: color-mix(in srgb, var(--stick-ink) 30%, transparent); color: inherit; }
.stick .link { justify-self: start; color: inherit; }
.stick .tick { background: transparent; border-color: color-mix(in srgb, var(--stick-ink) 40%, transparent); }
.lined { --lh: 32px; padding-left: 34px; background-color: var(--nb); background-image: linear-gradient(90deg, transparent 26px, var(--nb-edge) 26px, var(--nb-edge) 27px, transparent 27px), repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--nb-rule) calc(var(--lh) - 1px), var(--nb-rule) var(--lh)); }
.lined textarea { display: block; width: 100%; min-height: calc(var(--lh) * 8); padding: 0 4px; border: 0; color: var(--pen); background: transparent; font-family: var(--kf), var(--zh); font-size: 16px; line-height: var(--lh); resize: none; overflow: hidden; }
.lined textarea:focus-visible { outline: none; }
.lined textarea::placeholder { color: var(--ink-3); }
.hots { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.hots button { display: grid; justify-items: center; padding: 4px 0; background: var(--nb); border: 1px solid var(--nb-rule); }
.hots .kf { font-size: 22px; line-height: 1.25; }
.hots i { font-family: var(--num); font-style: normal; font-size: 12px; line-height: 1.1; color: var(--pen); }
.nb-days { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.nb-days button { position: relative; flex: none; display: grid; justify-items: center; min-width: 46px; padding: 4px 8px; color: var(--ink-2); background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); }
.nb-days b { font-family: var(--num); font-size: 19px; font-weight: 600; line-height: 1.1; }
.nb-days small { font-size: 11px; }
.nb-days i { position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--pen); }
.nb-days button[aria-pressed="true"] { color: var(--on-deep); background: var(--line-deep); border-color: var(--line-deep); }
.nb-foot { margin-top: 12px; }
@media (min-width: 860px) {
  .nb { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background-image: linear-gradient(90deg, transparent calc(50% - 26px), color-mix(in srgb, var(--ink) 7%, transparent) 50%, transparent calc(50% + 26px)), radial-gradient(circle at 1px 1px, var(--nb-dot) .8px, transparent 1px); background-size: 100% 100%, 18px 18px; }
  .nb-page { padding: 24px 30px 30px; }
  .nk-t p { font-size: 13px; }
}

/* 打印：只留手写单，一页 A4 放完，剩下的空间留给自由练习 */
#print { display: none; }
@media print {
  @page { size: A4; margin: 11mm 12mm; }
  html, body { height: auto; background: #fff; color: #111; font-size: 11pt; }
  #app, #ses, #peek, .toast { display: none !important; }
  #print { display: flex; flex-direction: column; gap: 4.500mm; min-height: 272mm; }
  #print section { break-inside: avoid; }
  #print h1 { font-family: var(--ja); font-size: 15pt; font-weight: 900; letter-spacing: .08em; }
  #print h2 { margin-bottom: 1.5mm; font-size: 10.500pt; font-weight: 700; }
  .p-head { display: flex; justify-content: space-between; align-items: end; padding-bottom: 2mm; border-bottom: .6mm solid #111; }
  .p-no { font-family: var(--num); font-size: 11pt; }
  .p-row { display: grid; grid-template-columns: 8mm repeat(12, minmax(0, 1fr)); align-items: center; margin-bottom: 1mm; padding-right: .3mm; }
  .p-ro { font-family: var(--num); font-size: 11pt; color: #1c5fa8; }
  .pc { display: grid; place-items: center; aspect-ratio: 1; font-family: var(--kf); font-size: 25pt; font-weight: 600; line-height: 1; border: .2mm solid #999; border-left-width: 0; background-image: linear-gradient(#ccc, #ccc), linear-gradient(#ccc, #ccc); background-size: 100% .1mm, .1mm 100%; background-position: center; background-repeat: no-repeat; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .p-ro + .pc { border-left-width: .2mm; }
  .pc.t { color: #d4d4d4; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .p-t { width: 100%; border-collapse: collapse; }
  .p-t td { height: 8mm; padding: 0 2mm 0 0; border-bottom: .2mm solid #999; vertical-align: middle; font-size: 10pt; }
  .p-t small { font-family: var(--num); font-size: 10pt; color: #1c5fa8; }
  .p-w { width: 25mm; font-family: var(--ja); font-size: 13pt; font-weight: 700; }
  .p-r { width: 50mm; }
  .p-z { width: 34mm; }
  .p-t .p-line { border-left: .1mm dashed #bbb; }
  .p-f { font-size: 10pt; color: #444; }
  .p-ex { font-size: 11pt; }
  .p-note { white-space: pre-wrap; font-size: 10.500pt; }
  .p-fill { display: flex; flex-direction: column; flex: 1; min-height: 20mm; }
  .p-lines { flex: 1; min-height: 12mm; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 7.900mm, #999 7.900mm, #999 8mm); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}

/* 备份与同步 */
.set label small { display: block; font-size: 13px; color: var(--ink-3); }
.set-col .field { width: 100%; flex: none; }
.set-col .row .field { flex: 1 1 0; width: 0; }

#backup-zone.drag { outline: 2px dashed var(--line-deep); outline-offset: 2px; }

/* 声调线 */

.p-tip { font-size: 14px; color: var(--ink-2); text-wrap: pretty; }

.p-demo { display: grid; gap: 14px; margin-block: 10px; }
.nw-r { font-family: var(--ja); font-size: 15px; color: var(--ink-2); }
@media (min-width: 600px) { .p-demo { grid-template-columns: 1fr 1fr; } }
@media print {
  .pt .hi, .pt .up, .pt .dn { border-color: #d23b2f; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}

/* 音高镜：做成发车案内屏，颜色不随主题变化 */

.mir-top b { font-size: 26px; line-height: 1.2; }
.mir-tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--line-deep); }

.mir-board svg { display: block; width: 100%; height: auto; overflow: visible; }
.mir-col { stroke: color-mix(in srgb, var(--board-dim) 34%, transparent); stroke-dasharray: 2 4; }
.mir-mid { stroke: color-mix(in srgb, var(--board-dim) 24%, transparent); }

.mir-nat { stroke: var(--led); }
.mir-you { stroke: var(--led-ok); }
.mir-key { display: flex; gap: 14px; font-size: 12px; color: var(--board-dim); }
.mir-key span { display: inline-flex; align-items: center; gap: 6px; }
.mir-key span::before { content: ""; width: 16px; height: 3px; border-radius: 2px; background: var(--led); }

  drills:[["この|町{まち}|は|静{しず}か|です","这座城镇很安静。"],["田中{たなか}さん|は|親切{しんせつ}|な|人{ひと}|です","田中是个亲切的人。"],["ここ|は|便利{べんり}|じゃありません","这里不方便。"]],

  drills:[["旅行{りょこう}|は|とても|楽{たの}しかったです","旅行非常开心。"],["テスト|は|難{むずか}しかったです","考试很难。"],["昨日{きのう}|は|いい|天気{てんき}|でした","昨天天气很好。"],["日本語{にほんご}|は|あまり|難{むずか}しくないです","日语不太难。"]],
  dialog:[["田中","旅行{りょこう}はどうでしたか。","旅行怎么样？"],["王","とても楽{たの}しかったです。","非常开心。"],["田中","天気{てんき}はどうでしたか。","天气怎么样？"],["王","あまりよくなかったです。でも、ご飯{はん}はおいしかったです。","不太好。不过饭很好吃。"]] },

  drills:[["私{わたし}|は|魚{さかな}|が|好{す}きです","我喜欢鱼。"],["王{おう}さん|は|料理{りょうり}|が|上手{じょうず}です","小王很会做菜。"],["どんな|音楽{おんがく}|が|好{す}きです|か","你喜欢什么样的音乐？"]],
  dialog:[["田中","王{おう}さんはどんな料理{りょうり}が好{す}きですか。","小王喜欢什么料理？"],["王","日本{にほん}の料理{りょうり}が好{す}きです。魚{さかな}が好{す}きです。","我喜欢日本料理，喜欢吃鱼。"],["田中","料理{りょうり}は上手{じょうず}ですか。","你做菜拿手吗？"],["王","いいえ、下手{へた}です。","不，做得不好。"]] },

{ id:27, unit:4, st:"てください", stamp:"て形", zh:"请你做",
  intro:"て形是日语语法的大门。今天这一站比较长，慢慢来。",
  words:[["待ちます","まちます","等"],["話します","はなします","说"],["言います","いいます","说；讲"],["座ります","すわります","坐"],["教えます","おしえます","教；告诉"],["ゆっくり","ゆっくり","慢慢地"],["もう一度","もういちど","再一次"],["わかりました","わかりました","明白了"]],
  grammar:[
   {p:"三类动词",m:"一类　二类　三类",note:"二类：ます前是え段（食べます），或者見ます、起きます等少数词。三类：只有します和来ます。其余都是一类。",ex:[["行{い}きます・飲{の}みます","一类"],["食{た}べます・見{み}ます","二类"],["します・来{き}ます","三类"]]},
   {p:"二类和三类的て形",m:"食べます→食べて　します→して　来ます→来て",note:"二类最简单，把ます换成て。三类直接记住。",ex:[["見{み}ます → 見{み}て","看"],["勉強{べんきょう}します → 勉強{べんきょう}して","学习"]]},
   {p:"一类的て形",m:"き→いて　ぎ→いで　い・ち・り→って\nみ・び・に→んで　し→して",note:"看ます前面那个假名决定怎么变。唯一的例外是行きます→行って。",ex:[["書{か}きます → 書{か}いて","写"],["待{ま}ちます → 待{ま}って","等"],["飲{の}みます → 飲{の}んで","喝"],["話{はな}します → 話{はな}して","说"]]},
   {p:"V てください",m:"请……",note:"礼貌地请别人做某事。对老师说ゆっくり話してください，非常实用。",ex:[["待{ま}ってください。","请等一下。"],["ゆっくり話{はな}してください。","请说慢一点。"],["もう一度{いちど}言{い}ってください。","请再说一遍。"]]},
  ],
  cloze:[["書きます → て形：","書いて",["書きて","書って","書んで"],"き变いて"],["飲みます → て形：","飲んで",["飲みて","飲って","飲いて"],"み变んで"],["行きます → て形：","行って",["行いて","行きて","行んで"],"例外"],["食べます → て形：","食べて",["食べって","食んで","食べいて"],"二类把ます换成て"]],
  drills:[["ちょっと|待{ま}ってください","请稍等。"],["ゆっくり|話{はな}してください","请说慢一点。"],["ここ|に|座{すわ}ってください","请坐这里。"],["もう一度{いちど}|言{い}ってください","请再说一遍。"]],
  dialog:[["王","すみません、もう一度{いちど}言{い}ってください。","不好意思，请再说一遍。"],["先生","はい。ゆっくり話{はな}しますね。","好，我说慢一点。"],["先生","ここに名前{なまえ}を書{か}いてください。","请在这里写名字。"],["王","はい、わかりました。","好，明白了。"]] },

/* 词的振假名：去掉首尾相同的假名，只给汉字部分注音 */
function split(w) {
  let d = w[0], r = w[1], lead = "";
  if (d[0] === "〜") { lead = "〜"; d = d.slice(1); }
  if (!KANJI.test(d)) return { lead, d, r, plain: true };
  let a = 0; while (a < d.length && d[a] === r[a]) a++;
  let b = 0; while (b < d.length - a && d[d.length - 1 - b] === r[r.length - 1 - b]) b++;
  return { lead, pre: d.slice(0, a), core: d.slice(a, d.length - b), rd: r.slice(a, r.length - b), post: d.slice(d.length - b) };
}
function wordHtml(w, tap) {
  const p = split(w);
  if (p.plain) return p.lead + kanaHtml(p.d, tap);
  return p.lead + kanaHtml(p.pre, tap) + kanjiHtml(p.core, p.rd) + kanaHtml(p.post, tap);
}

/* 练习题干里的汉字自动注音，字典来自课程词汇，再补上固定读法 */
const READ = {
  田中: "たなか", 王: "おう", 山田: "やまだ", 東京: "とうきょう", 日本: "にほん", 中国: "ちゅうごく",

  月曜日: "げつようび", 高: "たか", 寒: "さむ", 大: "おお", 親切: "しんせつ", 静: "しず", 簡単: "かんたん",
  来: "き", 行: "い", 勉強: "べんきょう", 三百円: "さんびゃくえん", 上手: "じょうず", 歌: "うた",
};
const DICT = (() => {
  const dict = {};
  for (const l of LESSONS) for (const w of l.words) {
    const p = split(w);
    if (!p.plain && !KANJI.test(p.rd) && !/[ぁ-ん]/.test(p.core)) dict[p.core] = p.rd;
  }
  return { ...dict, ...READ };
})();
function autoRuby(s) {
  if (!/[ぁ-んァ-ン]/.test(s)) return esc(s);
  /* 括号里是中文提示，整段跳过；连续汉字必须被字典完全覆盖才注音，避免碰到中文词 */
  return esc(s).split(/(（.*?）)/).map(part => part[0] === "（" ? part : ruby(part.replace(/[㐀-鿿々]+/g, (run, at, all) => {
    if (run === "何") return `何{${all.startsWith("です", at + 1) ? "なん" : "なに"}}`;
    if (DICT[run]) return `${run}{${DICT[run]}}`;
    let out = "", i = 0;
    while (i < run.length) {
      let len = 0;
      for (let n = run.length - i; n > 0; n--) if (DICT[run.substr(i, n)]) { len = n; break; }
      if (!len) return run;
      const k = run.substr(i, len);
      out += `${k}{${DICT[k]}}`; i += len;
    }
    return out;
  }))).join("");
}

const blank = () => ({ v: 1, epoch: 0, t: 0, xp: 0, days: {}, done: {}, srs: {}, my: {}, plan: null, kana: {}, kdone: {}, kplace: {}, kbest: {}, gram: {}, ba: {}, fz: { n: 1, at: 0 }, name: "", goal: 40, kmark: {}, knote: {}, wnote: {}, notes: {}, set: { furi: true, slow: false, ro: "smart", sfx: true } });
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); return { ...blank(), ...o, set: { ...blank().set, ...o.set } }; } } catch {}
  return blank();
}
let S = load();
function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function save() { S.t = Date.now(); writeLocal(); queueSync(); }

/* 两台设备的进度取并集；重置过的一方 epoch 更大，整体胜出 */
function merge(a, b) {
  if ((a.epoch || 0) !== (b.epoch || 0)) return JSON.parse(JSON.stringify((a.epoch || 0) > (b.epoch || 0) ? a : b));
  const m = JSON.parse(JSON.stringify(a));
  m.xp = Math.max(a.xp || 0, b.xp || 0);
  m.done = { ...(b.done || {}), ...(a.done || {}) };
  m.my = { ...(b.my || {}), ...(a.my || {}) };
  m.kdone = { ...(b.kdone || {}), ...(a.kdone || {}) };
  m.kplace = { ...(b.kplace || {}), ...(a.kplace || {}) };
  m.ba = { ...(b.ba || {}), ...(a.ba || {}) };
  m.gram = { ...(a.gram || {}) };
  for (const f of ["kmark", "knote", "wnote", "notes"]) {
    m[f] = { ...(a[f] || {}) };
    for (const [k, v] of Object.entries(b[f] || {})) if (!m[f][k] || (v.at || 0) > (m[f][k].at || 0)) m[f][k] = v;
  }
  for (const [k, v] of Object.entries(b.gram || {})) if (!m.gram[k] || (v.at || 0) > (m.gram[k].at || 0)) m.gram[k] = v;
  if ((b.fz?.at || 0) > (a.fz?.at || 0)) m.fz = b.fz;
  m.kana = { ...(a.kana || {}) };
  for (const [k, v] of Object.entries(b.kana || {})) if (!m.kana[k] || (v.at || 0) > (m.kana[k].at || 0)) m.kana[k] = v;
  m.kbest = { speed: Math.max(a.kbest?.speed || 0, b.kbest?.speed || 0) };
  const fast = [a.kbest?.match, b.kbest?.match].filter(Boolean);
  if (fast.length) m.kbest.match = Math.min(...fast);
  if ((b.plan?.at || 0) > (a.plan?.at || 0)) m.plan = b.plan;
  for (const [k, v] of Object.entries(b.days || {})) {
    const x = m.days[k];
    m.days[k] = x ? { ...v, ...x, xp: Math.max(x.xp, v.xp), lessons: [...new Set([...x.lessons, ...v.lessons])], reviews: Math.max(x.reviews, v.reviews), cards: Math.max(x.cards || 0, v.cards || 0), gram: Math.max(x.gram || 0, v.gram || 0) } : v;
  }
  for (const [k, v] of Object.entries(b.srs || {})) if (!m.srs[k] || (v.at || 0) > (m.srs[k].at || 0)) m.srs[k] = v;
  if ((b.t || 0) > (a.t || 0)) { m.set = { ...m.set, ...b.set }; m.goal = b.goal || m.goal; m.name = b.name ?? m.name; }
  m.t = Math.max(a.t || 0, b.t || 0);
  return m;
}

const sync = { state: "local", doc: null, timer: 0, busy: false, again: false };
function queueSync() { if (!sync.doc) return; clearTimeout(sync.timer); sync.timer = setTimeout(push, 1500); }
async function push() {
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true;
  try {
    const snap = await sync.doc.get();
    if (snap.exists) { S = merge(S, snap.data()); registerMy(); writeLocal(); }
    await sync.doc.set(JSON.parse(JSON.stringify(S)));
    sync.state = "cloud";
  } catch { sync.state = "error"; }
  sync.busy = false;
  if (sync.again) { sync.again = false; push(); }
  if (!ses && view === "book") render();
}
async function initSync() {
  if (!window.claude || !window.claude.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  const id = db && user ? await user.id() : null;
  if (!id) return;
  sync.doc = db.doc("data/users/" + id + "/progress");
  try {
    const snap = await sync.doc.get();
    if (snap.exists) { S = merge(S, snap.data()); registerMy(); writeLocal(); sync.state = "cloud"; if (!ses) render(); }
    else if (S.t) await push();
    else sync.state = "cloud";
  } catch { sync.state = "error"; }
  if (!ses && view === "book") render();
}

const dayRec = k => (S.days[k] ||= { xp: 0, lessons: [], reviews: 0 });
const active = k => { const d = S.days[k]; return !!d && (d.lessons.length > 0 || d.reviews > 0 || d.cards > 0 || d.gram > 0 || !!d.fz); };
function streak() {
  let k = today(), n = 0;
  if (!active(k)) k = addDays(k, -1);
  while (active(k)) { n++; k = addDays(k, -1); }
  return n;
}
const nextLesson = () => LESSONS.find(l => !S.done[l.id]);
const dueKeys = () => Object.entries(S.srs).filter(([, v]) => v.due <= today()).sort((a, b) => a[1].due < b[1].due ? -1 : a[1].b - b[1].b).map(([k]) => k);

const MY = { id: LESSONS.length, words: [] };
function registerMy() {
  S.my ||= {}; S.kana ||= {}; S.kdone ||= {}; S.kplace ||= {}; S.kbest ||= {}; S.gram ||= {}; S.ba ||= {}; S.fz ||= { n: 1, at: 0 }; S.goal ||= 40; S.name ??= ""; S.kmark ||= {}; S.knote ||= {}; S.wnote ||= {}; S.notes ||= {}; S.set.ro ||= "smart"; S.set.sfx ??= true;
  MY.words = Object.values(S.my);
  for (const w of MY.words) WORD["w:" + w[0]] = { w, l: MY };

const CLIP_AT = {}, SLOW_AT = {}, PACKS = {};
AUDIO.at.forEach((l, i) => l.forEach(t => { CLIP_AT[t] = AUDIO.clips[i]; }));
AUDIO.slowAt.forEach((l, i) => l.forEach(t => { SLOW_AT[t] = AUDIO.slow[i]; }));
const hasClip = t => t in CLIP_AT;
const clipCount = () => Object.keys(CLIP_AT).length;
/* 动态加脚本被页面策略拦住时，改用 fetch 读出里面的 JSON */
async function fetchPack(src) {
  const t = await (await fetch(src)).text();
  Object.assign(window[src.startsWith("slow") ? "SLOW" : "CLIPS"] ||= {}, JSON.parse(t.slice(t.indexOf(", {") + 2, t.lastIndexOf(")"))));
}
const loadPack = src => PACKS[src] ||= new Promise(ok => {
  const s = document.createElement("script");
  s.src = src; s.onload = () => ok(true);
  s.onerror = () => fetchPack(src).then(() => ok(true), () => { delete PACKS[src]; ok(false); });
  document.head.append(s);
});
const tts = { voice: null, ok: typeof speechSynthesis !== "undefined", turn: 0 };
const snd = { el: null, ctx: null, src: null };
function pickVoice() {
  if (!tts.ok) return;
  const ja = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  tts.voice = ja.find(v => /kyoko|otoya|o-ren|nanami|google/i.test(v.name)) || ja[0] || null;
}
if (tts.ok) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
const canHear = t => hasClip(t) || (tts.ok && !!tts.voice);
const canListen = () => clipCount() > 0 || (tts.ok && !!tts.voice);
function stopSound() {
  tts.turn++;
  melodyStop();
  if (snd.el) { snd.el.onended = null; snd.el.pause(); }
  try { snd.src?.stop(); } catch {}
  snd.src = null;
  if (tts.ok) speechSynthesis.cancel();
}
function audioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  return AC ? snd.ctx ||= new AC() : null;
}
/* 有的页面环境不让 audio 元素放 data 地址，这时解码后交给 Web Audio */
async function playBuffer(b64, onend) {
  try {
    const ctx = audioCtx();
    await ctx.resume();
    const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const src = ctx.createBufferSource();
    src.buffer = await ctx.decodeAudioData(buf.buffer);
    src.connect(ctx.destination);
    src.onended = () => onend?.();
    snd.src = src; src.start();
  } catch { toast("录音放不出来，请检查音量和声音权限"); }
}
async function playClip(text, slow, onend) {
  const turn = tts.turn, own = slow && SLOW_AT[text], got = () => own ? window.SLOW?.[text] : window.CLIPS?.[text];
  if (!got()) {
    const wait = setTimeout(() => toast("录音加载中"), 500), ok = await loadPack(own || CLIP_AT[text]);
    clearTimeout(wait);
    if (turn !== tts.turn) return;
    if (!ok || !got()) return toast(navigator.onLine ? "录音下载失败，请稍后再试" : "这条录音还没存到本机，联网后再听");
  }
  const b64 = got(), rate = slow && !own ? .75 : 1, el = snd.el ||= new Audio();
  el.onended = onend || null;
  el.preservesPitch = true;
  el.defaultPlaybackRate = rate;
  el.src = "data:audio/mpeg;base64," + b64;
  el.playbackRate = rate;
  el.play().catch(e => { if (e.name !== "AbortError") playBuffer(b64, onend); });
}
function speak(text, slow, onend) {
  if (!tts.ok) return toast("这个浏览器不支持朗读");
  if (!tts.voice) pickVoice();
  const turn = tts.turn;
  let started = false;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; if (tts.voice) u.voice = tts.voice;
  u.rate = slow ? .6 : .9;
  u.onstart = () => { started = true; };
  u.onend = () => onend?.();
  setTimeout(() => { speechSynthesis.resume(); speechSynthesis.speak(u); }, 30);
  setTimeout(() => { if (!started && turn === tts.turn) toast("这句是 AI 现写的，没有录音，这台设备也读不出来"); }, 2500);
}
function say(text, slow = S.set.slow, onend) {
  stopSound();
  if (hasClip(text)) playClip(text, slow, onend); else speak(text, slow, onend);
}
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.append(t); setTimeout(() => t.remove(), 2400);
}

/* ---------- 组题 ---------- */
const poolTo = id => LESSONS.filter(l => l.id <= id).flatMap(l => l.words);
function pick(correct, lessonWords, pool, field, n = 3) {
  const seen = new Set([field(correct)]), out = [];
  for (const w of [...shuffle(lessonWords), ...shuffle(pool)]) {
    const v = field(w);
    if (seen.has(v)) continue;
    seen.add(v); out.push(w);
    if (out.length === n) break;
  }
  return out;
}
const after = w => `<span class="ja" lang="ja">${wordHtml(w)}</span>　${esc(w[2])}`;
function qMeaning(w, l) {
  const ds = pick(w, l.words, poolTo(l.id), x => x[2]);
  return { kind: "mc", label: "选出意思", q: wordHtml(w), jp: true, big: true, say: w[1], auto: true, srs: "w:" + w[0],
    choices: shuffle([w, ...ds]).map(x => ({ html: esc(x[2]), key: x[2] })), ans: w[2], after: after(w) };
}
function qWord(w, l) {
  const ds = pick(w, l.words, poolTo(l.id), x => x[0]);
  return { kind: "mc", label: "选出日语", q: esc(w[2]), say: w[1], srs: "w:" + w[0], two: true,
    choices: shuffle([w, ...ds]).map(x => ({ html: wordHtml(x), key: x[0], ja: true })), ans: w[0], after: after(w) };
}
function qListen(w, l) {
  const ds = pick(w, l.words, poolTo(l.id), x => x[1]);
  return { kind: "mc", label: "听音选词", listen: w[1], say: w[1], auto: true, srs: "w:" + w[0], two: true,
    choices: shuffle([w, ...ds]).map(x => ({ html: kanaHtml(esc(x[1])), key: x[1], ja: true })), ans: w[1], after: after(w) };
}
function qSpell(w, l) {
  const chars = [...w[1]];
  const kata = /[ァ-ヶー]/.test(w[1]);
  const extra = shuffle(poolTo(l.id).flatMap(x => [...x[1]]).filter(c => /[ァ-ヶー]/.test(c) === kata && !chars.includes(c))).filter((c, i, a) => a.indexOf(c) === i).slice(0, 3);
  return { kind: "tiles", label: "拼出读音", q: `${wordHtml(w)}`, jp: true, sub: esc(w[2]), srs: "w:" + w[0], say: w[1],
    tiles: shuffle([...chars, ...extra]).map(c => ({ html: kanaHtml(c), t: c })), ans: [w[1]], after: after(w) };
}
function qDrill(d, l, key) {
  const toks = d[0].split("|");
  const full = toks.join("");
  const noise = shuffle(l.words.filter(w => w[0][0] !== "〜" && !plain(full).includes(w[0]))).slice(0, toks.length > 3 ? 2 : 1);
  return { kind: "tiles", label: "把句子排好", q: esc(d[1]), srs: key, say: plain(full) + "。",
    tiles: shuffle([...toks.map(t => ({ html: ruby(t), t: plain(t) })), ...noise.map(w => ({ html: wordHtml(w), t: w[0] }))]),
    ans: [plain(full), ...(d[2] || []).map(plain)], after: `<span class="ja" lang="ja">${ruby(full)}。</span>　${esc(d[1])}` };
}
function qCloze(c) {
  const jp = /[ぁ-んァ-ン]/.test(c[0]) && !/[读哪怎说是的]/.test(c[0]);
  const tail = c[0].split(/[：—]+/).filter(Boolean).pop();
  const spoken = !/[ぁ-んァ-ン]/.test(c[1]) ? null : tail.includes("＿") ? tail.replace(/＿+/, c[1]).replace(/（.*?）/g, "") : c[1];
  return { kind: "mc", label: "选出正确的一项", q: autoRuby(c[0]), jp,
    choices: shuffle([c[1], ...c[2]]).map(x => ({ html: autoRuby(x), key: x, ja: /[ぁ-んァ-ン]/.test(x) })), ans: c[1],
    say: spoken, after: `<span class="ja" lang="ja">${autoRuby(c[1])}</span>　${esc(c[3])}` };
}
function qPair(p) {
  return { kind: "mc", label: "听一听，是哪个？", listen: p[0], say: p[0], auto: true, two: true,
    choices: p[1].map(x => ({ html: kanaHtml(esc(x)), key: x, ja: true })), ans: p[0], after: `<span class="ja" lang="ja">${kanaHtml(esc(p[0]))}</span>` };
}
function buildLesson(l, again) {
  const steps = [{ k: "arrive", l, again }];
  /* 第一站教读音规则，要先讲规则，后面的词才读得出来 */
  const rules = l.grammar.map(g => ({ k: "rule", g }));
  if (l.id === 1) steps.push(...rules);
  l.words.forEach((w, i) => steps.push({ k: "word", w, i, n: l.words.length, l }));
  if (l.id !== 1) steps.push(...rules);
  const makers = canListen() ? [qMeaning, qListen, qWord] : [qMeaning, qWord];
  shuffle(l.words).slice(0, 6).forEach((w, i) => steps.push({ k: "q", q: makers[i % makers.length](w, l) }));
  const spellable = l.words.filter(w => w[1].length >= 3 && w[1].length <= 6 && w[0][0] !== "〜");
  shuffle(spellable).slice(0, 2).forEach(w => steps.push({ k: "q", q: qSpell(w, l) }));
  if (l.pair && canListen()) l.pair.forEach(p => steps.push({ k: "q", q: qPair(p) }));
  l.cloze.forEach(c => steps.push({ k: "q", q: qCloze(c) }));
  l.drills.forEach((d, i) => steps.push({ k: "q", q: qDrill(d, l, `s:${l.id}:${i}`) }));
  if (l.dialog.length) steps.push({ k: "talk", l });
  return steps;
}
function buildReview() {
  return dueKeys().slice(0, SESSION_CAP).map(key => {
    if (DRILL[key]) { const { d, l } = DRILL[key]; return { k: "q", q: qDrill(d, l, key), key }; }
    const { w, l } = WORD[key], b = S.srs[key].b;
    const spellable = w[1].length >= 3 && w[1].length <= 7 && w[0][0] !== "〜";
    let q = b <= 1 ? qMeaning(w, l) : b === 2 ? (canHear(w[1]) ? qListen(w, l) : qWord(w, l)) : b === 3 || !spellable ? qWord(w, l) : qSpell(w, l);
    return { k: "q", q, key };
  });
}

/* ---------- 课程流程 ---------- */
let ses = null, view = "home", wordFilter = { q: "", mode: "all", tab: "n5" }, confirmReset = false;
const sesEl = document.getElementById("ses"), appEl = document.getElementById("app");

function begin(kind, steps, extra = {}) {
  ses = { kind, steps, i: 0, picks: [], checked: null, correct: 0, tried: 0, missed: new Set(), xp: 0, leaving: false, ...extra };
  renderSes();
}
function checkMc(key) {
  const st = ses.steps[ses.i]; if (ses.checked) return;
  settle(st, key === st.q.ans, key);
}
function checkTiles() {
  const st = ses.steps[ses.i], got = ses.picks.map(i => st.q.tiles[i].t).join("");
  settle(st, st.q.ans.includes(got), got);
}
function settle(st, ok, picked) {
  ses.checked = { ok, picked };
  if (picked !== null) (ok ? ses.fast ? sfx.slash : sfx.correct : sfx.wrong)();
  const first = !st.retry;
  ses.tried += first ? 1 : 0;
  if (ok) { if (first) { ses.correct++; ses.xp += 2; } }
  else {
    if (st.q.srs) ses.missed.add(st.q.srs);
    const q = st.q.kind === "mc" ? { ...st.q, choices: shuffle(st.q.choices) } : st.q;
    if (!ses.noRetry) ses.steps.push({ ...st, q, retry: true, spoken: false });
  }
  if (ses.kind === "review" && st.key && first) grade(st.key, ok);
  if (st.q.ka && first) kGrade(st.q.ka, ok);
  if (ses.fast) { ses.checked = null; return advance(); }
  renderSes();
  if (st.q.say) say(st.q.say);
}
function grade(key, ok) {
  const r = S.srs[key]; if (!r) return;
  r.b = ok ? Math.min(r.b + 1, INTERVALS.length - 1) : Math.max(1, r.b - 1);
  if (!ok) r.x = (r.x || 0) + 1;
  r.due = addDays(today(), ok ? INTERVALS[r.b] : 1);
  r.at = Date.now();
}
function advance() {
  stopSound(); T.ctl?.abort();
  ses.i++; ses.picks = []; ses.checked = null;
  if (ses.i >= ses.steps.length) return finish();
  renderSes();
}
function finish() {
  if (ses.kind === "kana") return kFinish();
  if (ses.kind === "kview") return leave();
  if (ses.kind === "cards") return cFinish();
  if (ses.kind === "gram") return gFinish();
  const t = today(), day = dayRec(t);
  if (ses.kind === "lesson") {
    const l = ses.l, first = !S.done[l.id];
    ses.xp += first ? 10 : 0;
    if (first) {
      S.done[l.id] = { d: t, acc: ses.tried ? Math.round(ses.correct / ses.tried * 100) : 100 };
      const seed = { b: 1, due: addDays(t, 1), at: Date.now() };
      l.words.forEach(w => { S.srs["w:" + w[0]] ||= { ...seed }; });
      l.drills.forEach((_, i) => { S.srs[`s:${l.id}:${i}`] ||= { ...seed }; });
      day.lessons.push(l.id);
    }
    ses.first = first;
  } else {
    day.reviews += ses.tried;
  }
  credit(); save();
  ses.done = true;
  renderSes();
}
function leave() { stopSound(); T.ctl?.abort(); clearInterval(ses?.timer); ses = null; sesEl.hidden = true; document.body.style.overflow = ""; render(); }

/* ---------- 词的讲解：拍数、罗马音、读音提示和例句都从课程数据算出来 ---------- */
const RO = Object.fromEntries("あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo".split(" ").map(x => [x[0], x.slice(1)]));
const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 96));
const beats = r => [...r].reduce((a, c) => { /[ゃゅょぁぃぅぇぉャュョァィゥェォ]/.test(c) && a.length ? a[a.length - 1] += c : a.push(c); return a; }, []);
function beatRo(b) {
  const h = hira(b), base = RO[h[0]] || "";
  if (h.length < 2) return base;
  const v = { ゃ: "a", ゅ: "u", ょ: "o", ぁ: "a", ぃ: "i", ぅ: "u", ぇ: "e", ぉ: "o" }[h[1]];
  if (/[ゃゅょ]/.test(h[1])) return /^(shi|chi|ji)$/.test(base) ? base.slice(0, -1) + v : base.slice(0, -1) + "y" + v;
  return base.replace(/[aiueo]$/, "") + v;
}
function moraRo(bs, i) {
  const b = bs[i];
  if (/[っッ]/.test(b)) { const n = beatRo(bs[i + 1] || ""); return n.startsWith("ch") ? "t" : n[0] || ""; }
  if (b === "ー") return beatRo(bs[i - 1] || "").slice(-1);
  return beatRo(b);
}
/* こんにちは、こんばんは 结尾的 は 是助词，读 wa */
function romaji(r) {
  const bs = beats(r.replace(/[〜\s]/g, "").replace(/(こんにち|こんばん)は$/, "$1わ"));
  return bs.map((_, i) => moraRo(bs, i)).join("");
}
function readTips(r) {
  const bs = beats(r.replace(/[〜\s]/g, "")), tips = new Set();
  const longV = { a: "あ", i: "い", u: "う", e: "いえ", o: "うお" };
  bs.forEach((b, i) => {
    const prev = bs[i - 1], next = bs[i + 1];
    if (/[っッ]/.test(b) && next) tips.add(`小写的 ${b} 不发音，停顿一拍，再读 ${next}`);
    else if (b.length > 1) tips.add(`${b} 是两个假名合成一拍，读成一个音`);
    else if (b === "ん" || b === "ン") tips.add(`${b} 自己占一拍，不要吞掉`);
    else if (prev && b === "ー") tips.add(`${prev}${b} 是长音，${prev} 拉长成两拍`);
    else if (prev && longV[beatRo(prev).slice(-1)]?.includes(b)) tips.add(`${prev}${b} 是长音，${prev} 拉长成两拍`);
  });
  return [...tips].slice(0, 3);
}
const SENT = LESSONS.flatMap(l => [
  ...l.drills.map(d => ({ l, raw: d[0].replaceAll("|", "") + "。", zh: d[1] })),
  ...l.dialog.map(d => ({ l, raw: d[1], zh: d[2] })),
  ...l.grammar.flatMap(g => g.ex.map(e => ({ l, raw: e[0], zh: e[1] }))),
]).filter(s => /[。？！]/.test(s.raw));
function exampleFor(w, l) {
  const p = split(w), key = p.plain ? p.d : `${p.core}{${p.rd}}${p.post}`, own = WEX[w[0]];
  if (own) return { raw: own[0], zh: own[1] };
  if (key.length < 2) return null;
  const rank = s => (s.l.id < l.id ? 100 + s.l.id : s.l.id - l.id) * 100 + s.raw.length;
  return SENT.filter(s => (p.plain ? plain(s.raw) : s.raw).includes(key)).sort((a, b) => rank(a) - rank(b))[0] || null;
}
function wordLearn(w, l) {
  const bs = beats(w[1].replace(/[〜\s]/g, "")), ex = exampleFor(w, l), same = w[0].replace("〜", "") === w[2], yue = yueNote(w);
  return `<div class="learn"><div class="eyebrow">怎么读</div>

    ${readTips(w[1]).map(t => `<p class="li">${t}</p>`).join("")}
    ${same || yue ? `<div class="eyebrow">怎么记</div>` : ""}${same ? `<p>汉字和中文一样，意思也一样，只要记住读音。</p>` : ""}${yue}
    ${ex ? `<div class="eyebrow">怎么用</div>${exRow([ex.raw, ex.zh])}` : ""}</div>`;
}

  else if (q.big) html += `<div class="big" lang="ja">${q.q}</div>`;
  else html += `<div class="q${q.jp ? " jp" : ""}"${q.jp ? ' lang="ja"' : ""}>${q.q}</div>`;
  if (q.sub) html += `<div>${q.sub}</div>`;
  if (q.kind === "mc") {
    html += `<div class="opts${q.two ? " two" : ""}">${q.choices.map((c, i) => {
      const cls = checked ? (c.key === q.ans ? " right" : c.key === checked.picked ? " wrong" : "") : "";
      return `<button class="opt${cls}" data-a="mc" data-v="${esc(c.key)}" ${checked ? "disabled" : ""}><kbd>${i + 1}</kbd><span class="${c.ja ? "ja" : ""}"${c.ja ? ' lang="ja"' : ""}>${c.html}</span></button>`;
    }).join("")}</div>`;
  } else if (q.kind === "type") {
    html += `<form class="row" data-f="ktype"><input class="field" id="ktype" lang="en" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="比如 ka" aria-label="读音" value="${esc(checked?.picked || "")}" ${checked ? "disabled" : ""}><button class="btn" ${checked ? "disabled" : ""}>确定</button></form>`;
  } else {
    html += `<div class="tray" aria-label="你的答案">${ses.picks.map((i, n) => `<button class="tile" data-a="unpick" data-v="${n}" ${checked ? "disabled" : ""} lang="ja">${q.tiles[i].html}</button>`).join("")}</div>
      <div class="bank">${q.tiles.map((t, i) => `<button class="tile" data-a="pick" data-v="${i}" ${ses.picks.includes(i) || checked ? "disabled" : ""} lang="ja">${t.html}</button>`).join("")}</div>`;
  }
  if (!checked) html += `<button class="idk" data-a="idk">不会，告诉我答案</button>`;
  else if (!checked.ok) html += aiBlock(st, "为什么？请导师讲一下");
  let foot;
  if (checked) foot = verdict(q, checked.ok);
  else if (q.kind === "tiles") foot = btn("检查", "check", !ses.picks.length);
  else foot = "";
  return { html, foot, cls: checked ? (checked.ok ? "good" : "bad") : "", auto: !checked && q.auto ? q.say : null };
}
const btn = (t, a = "next", off = false) => `<button class="btn" data-a="${a}" ${off ? "disabled" : ""} data-primary>${t}</button>`;
function verdict(q, ok) {

function renderSes() {

    <text font-size="${l.st.length > 5 ? 9.500 : 11}" font-weight="700" text-anchor="middle" font-family="var(--ja)" letter-spacing="1.500"><textPath href="#arc${l.id}" startOffset="50%">${l.st}</textPath></text>
    <text x="60" y="${60 + big / 3}" font-size="${big}" font-weight="900" text-anchor="middle" font-family="var(--ja)">${l.stamp}</text>

/* ---------- 事件 ---------- */
const ACT = {
  tab(v) { view = v; confirmReset = false; render(); window.scrollTo(0, 0); },
  say(v, b) { say(v); },
  lesson(v) { const l = LESSONS[v - 1]; ses = null; begin("lesson", buildLesson(l, !!S.done[l.id]), { l }); },
  review() { begin("review", buildReview()); },
  station(v) {
    const n = nextLesson();
    if (S.done[v] || (n && n.id === +v)) ACT.lesson(+v);
    else toast("先到达前面的车站，这一站才会开放");
  },
  next: advance,
  idk() { settle(ses.steps[ses.i], false, null); },
  mc: checkMc,
  check: checkTiles,
  pick(v) { ses.picks.push(+v); renderSes(); },
  unpick(v) { ses.picks.splice(+v, 1); renderSes(); },
  askLeave() { if (ses.i === 0) return leave(); ses.leaving = true; renderSes(); },
  stay() { ses.leaving = false; renderSes(); },
  leave,
  playAll() {
    const lines = ses.steps[ses.i].l.dialog;
    const line = i => {
      sesEl.querySelectorAll(".bub").forEach((b, n) => b.classList.toggle("play", n === i));
      if (i < lines.length) say(plain(lines[i][1]), undefined, () => line(i + 1));
    };
    line(0);
  },
  wtab(v) { wordFilter.tab = v; render(); },
  wmode(v) { wordFilter.mode = v; render(); },
  setFuri() { S.set.furi = !S.set.furi; save(); render(); },
  setSlow() { S.set.slow = !S.set.slow; save(); render(); },
  setSfx() { S.set.sfx = !S.set.sfx; save(); sfx.correct(); render(); },
  askReset() { confirmReset = true; render(); },
  reset() { const epoch = (S.epoch || 0) + 1; S = { ...blank(), epoch }; clearT(); registerMy(); confirmReset = false; save(); render(); toast("进度已清空"); },

let roHide = false;

/* 句子没有分词，は へ 是助词还是词的一部分要靠词库判断：
   按“词的数量最少、不认识的字最少”切分，单独切出来的 は へ 才是助词 */
function particleAt(run) {
  const n = run.length, cost = Array(n + 1).fill(Infinity), from = Array(n + 1).fill(0), out = new Set();
  cost[0] = 0;
  for (let i = 0; i < n; i++) {
    for (let len = 1; len <= Math.min(RO_MAX, n - i); len++) {
      const w = run.slice(i, i + len);
      const c = RO_WORDS.has(w) ? (len > 1 ? 1 : 1.5) : len > 1 ? Infinity : RO_PARTICLE.has(w) ? 1.2 : 4;
      if (cost[i] + c < cost[i + len]) { cost[i + len] = cost[i] + c; from[i + len] = i; }
    }

  for (let e = n; e > 0; e = from[e]) if (e - from[e] === 1 && "はへ".includes(run[from[e]])) out.add(from[e]);

    at += b.length;
    return m;

function moraShow(ms, i) {
  if (roHide || S.set.ro === "off") return false;
  if (S.set.ro === "all") return true;
  const b = ms[i].b;
  if (/^[っッ]$/.test(b)) return !!ms[i + 1] && moraWeak(ms[i + 1].b);

function padDraw() {

function mountPad() {

  const at = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * 100, (e.clientY - b.top) / b.height * 100]; };
