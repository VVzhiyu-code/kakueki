/* 和标准笔画比较：笔数、每笔起点终点（判断顺序和方向），再用像素重合度判断形状 */
async function padCheck() {
  const { strokes, ch } = tr, msg = tr.el.querySelector(".pad-msg"), want = kStrokes(ch);
  if (!strokes.length) { msg.textContent = "先写一遍再检查。"; return; }
  await document.fonts.load('600 100px "Klee One"', ch).catch(() => {});
  const size = 100, ink = document.createElement("canvas"), mine = document.createElement("canvas");
  ink.width = ink.height = mine.width = mine.height = size;
  const a = ink.getContext("2d", { willReadFrequently: true }), b = mine.getContext("2d", { willReadFrequently: true });
  a.font = '600 100px "Klee One", sans-serif'; a.textAlign = "center"; a.fillText(ch, 50, 88);
  b.lineCap = b.lineJoin = "round"; b.lineWidth = 6;
  for (const s of strokes) { b.beginPath(); b.moveTo(s[0][0], s[0][1]); s.forEach(p => b.lineTo(p[0], p[1])); b.stroke(); }
  const A = a.getImageData(0, 0, size, size).data, B = b.getImageData(0, 0, size, size).data;
  const near = (D, x, y, r) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) { const X = x + i, Y = y + j; if (X >= 0 && Y >= 0 && X < size && Y < size && D[(Y * size + X) * 4 + 3] > 100) return true; } return false; };
  let inkN = 0, inkHit = 0, mineN = 0, mineHit = 0;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (A[(y * size + x) * 4 + 3] > 100) { inkN++; if (near(B, x, y, 5)) inkHit++; }
    if (B[(y * size + x) * 4 + 3] > 100) { mineN++; if (near(A, x, y, 5)) mineHit++; }
  }
  const shape = Math.min(inkHit / inkN, mineHit / mineN), notes = [];
  if (strokes.length !== want.length) notes.push(`标准写法是 ${want.length} 笔，你写了 ${strokes.length} 笔`);
  else {
    const d = (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]), tail = l => l[l.length - 1];
    const fit = (s, p) => Math.min(d(s[0], p[0]) + d(tail(s), tail(p)), d(s[0], tail(p)) + d(tail(s), p[0]));
    want.forEach((p, i) => {
      const s = strokes[i], best = want.reduce((b, q, j) => fit(s, q) < fit(s, want[b]) ? j : b, i);
      if (best !== i && fit(s, want[best]) < fit(s, p) - 10) notes.push(`你的第 ${i + 1} 笔应该是第 ${best + 1} 笔`);
      else if (d(s[0], tail(p)) + d(tail(s), p[0]) < d(s[0], p[0]) + d(tail(s), tail(p)) - 8) notes.push(`第 ${i + 1} 笔方向反了`);
    });
  }
  const star = Math.min(shape >= .82 ? 3 : shape >= .66 ? 2 : 1, notes.length ? 2 : 3);
  msg.textContent = `${"★".repeat(star)}${"☆".repeat(3 - star)}　${notes.length ? notes.join("，") + "。" : star === 3 ? "笔顺和字形都对，写得好。" : "笔顺对了，字形再贴近一点。"}`;
  tr.el.querySelector(".pad-show").removeAttribute("hidden");
}

function kFinish() {

  if (m === "lesson") {
    const r = ses.r, first = !S.kdone[r.id];
    S.kdone[r.id] = { d: t, acc: ses.tried ? Math.round(ses.correct / ses.tried * 100) : 100 };
    rowItems(r).forEach(i => { S.kana[i.ch] ||= kNew(); });
    if (first) ses.xp += 10;
  }
  if (m === "place") {
    const list = Object.keys(ses.res);
    for (const ch of list) {
      if (ses.res[ch]) S.kana[ch] ||= { b: 3, due: addDays(t, 3), at: Date.now(), bad: 0 };
      else S.kana[ch] = { b: 1, due: t, at: Date.now(), bad: 1 };
    }
    for (const r of KROWS) if (r.keys && r.set === ses.pset && rowItems(r).every(i => ses.res[i.ch])) S.kdone[r.id] ||= { d: t, acc: 100, place: true };
    S.kplace[ses.pset] = t;
  }
  if (m === "speed") { ses.xp = Math.min(30, ses.sp.score); S.kbest.speed = Math.max(S.kbest.speed || 0, ses.sp.score); }
  if (m === "match") { ses.xp = 10; if (ses.m.left) S.kbest.match = Math.min(S.kbest.match ?? 1e4, ses.m.left); }
  (ses.marked || []).forEach(ch => { const r = S.kana[ch] ||= kNew(); r.bad = (r.bad || 0) + 1; r.due = t; r.at = Date.now(); });

}

const LV_MAX = 50, GOAL_BONUS = 10, STUBBORN = 4, MASTER_B = 4, DAY_CARDS = 20;
const LV_NAME = ["各駅停車", "快速", "急行", "特急", "新幹線"];
const lvNeed = n => 60 + 20 * (n - 1);
const lvName = n => LV_NAME[Math.min(LV_NAME.length - 1, Math.floor((n - 1) / 10))];
function lvOf(xp) {
  let n = 1, left = xp;
  while (n < LV_MAX && left >= lvNeed(n)) { left -= lvNeed(n); n++; }
  return { n, left, need: n < LV_MAX ? lvNeed(n) : 0 };
}
const DAY_GOALS = [[20, "轻松", "约 5 分钟"], [40, "标准", "约 10 分钟"], [80, "认真", "约 20 分钟"]];

function bestStreak() {
  let best = 0, run = 0, last = "";
  for (const k of Object.keys(S.days).filter(active).sort()) {
    run = last && addDays(last, 1) === k ? run + 1 : 1;
    best = Math.max(best, run); last = k;
  }
  return best;
}
/* 断签一到两天时自动用补签卡，连续天数太短就不值得用 */
function applyFreeze() {
  const gap = [];
  let k = addDays(today(), -1);
  while (!active(k) && gap.length <= 2) { gap.push(k); k = addDays(k, -1); }
  if (!gap.length || gap.length > S.fz.n) return;
  let run = 0, c = k;
  while (active(c)) { run++; c = addDays(c, -1); }
  if (run < 3) return;
  gap.forEach(d => { dayRec(d).fz = 1; });
  S.fz = { n: S.fz.n - gap.length, at: Date.now() };
  save();
  if (!ses) render();
  toast(`用掉 ${gap.length} 张补签卡，连续打卡保住了`);
}

function credit() {

/* 在 Claude 里走下载能力；手机上用系统分享，可以存到相册或文件；电脑上走普通下载 */
async function saveFile(name, blob) {
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) return await dl.save({ filename: name, data: blob });
    const file = new File([blob], name, { type: blob.type });
    if (navigator.maxTouchPoints > 0 && navigator.canShare?.({ files: [file] })) return await navigator.share({ files: [file] });
  } catch (e) {
    if (e?.code === "declined" || e?.name === "AbortError") return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4e3);
}

/* ---------- 备份加密 ----------
   设了备份密码时用 AES-GCM 加密，密钥由密码派生，文件里只有盐、随机数和密文 */
const toB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await deriveKey(pass, salt), new TextEncoder().encode(text));
  return JSON.stringify({ kakueki: 1, salt: toB64(salt), iv: toB64(iv), data: toB64(new Uint8Array(data)) });
}
async function unseal(o, pass) {
  const key = await deriveKey(pass, fromB64(o.salt));
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(o.iv) }, key, fromB64(o.data)));
}
const packBackup = () => { const body = JSON.stringify(S); return app.dav.key ? seal(body, app.dav.key) : body; };
/* 读备份：密码不对或缺密码时抛出 key、need，文件不对时抛出 bad */
async function readBackup(text, key) {
  let o;
  try { o = JSON.parse(text); } catch { throw "bad"; }
  if (o?.salt && o.data) {
    if (!key) throw "need";
    try { o = JSON.parse(await unseal(o, key)); } catch { throw "key"; }
  }
  if (!o || o.v !== 1 || !o.days || !o.srs) throw "bad";
  return o;
}

}
function outHtml() {
  const k = T.tool;
  const html = k === "vocab" ? vocabRows() : rich(T[k].out || (k === "plan" && S.plan ? S.plan.text : ""));
  return html || (T.busy === k ? `<p class="think">正在想，第一次要先在弹窗里允许，可能需要一分钟</p>` : "");
}
const output = () => `<div id="tu-out" class="rich" aria-live="polite">${outHtml()}</div>
  ${T.busy === T.tool ? `<button class="chip stop" data-a="stop">停止</button>` : ""}`;
const noteHtml = () => T.note ? `<p class="tu-note" role="status">${esc(T.note)}</p>` : "";
const choice = (path, list, cur, unit = "") => list.map(v => `<button class="chip" data-a="choose" data-v="${path}:${v}" aria-pressed="${v === cur}">${v}${unit}</button>`).join("");
const form = (f, bind, val, hint, label) => `<form class="row" data-f="${f}"><input class="field" data-b="${bind}" value="${esc(val)}" placeholder="${hint}" aria-label="${hint}" autocomplete="off"><button class="btn" ${T.busy ? "disabled" : ""}>${label}</button></form>`;

function planView() {
  const p = T.plan;
  return `<p class="lead">告诉导师你的目标，它会看你学到第几站，排出接下来 4 周的计划。</p>
    <div class="tools">${choice("plan.goal", GOALS, p.goal)}</div><div class="tools">${choice("plan.mins", MINS, p.mins, " 分钟")}</div>
    <button class="btn" data-a="planGo" ${T.busy ? "disabled" : ""}>${p.out || S.plan ? "重新制定计划" : "制定 4 周计划"}</button>${noteHtml()}${output()}`;
}
function vocabView() {
  const v = T.vocab, left = v.rows.filter(r => !S.srs["w:" + r.w]).length;
  return `<p class="lead">按目标列出最有用的 100 个词和短语，收进词本的词会进入每天的复习。</p>
    <div class="tools">${choice("vocab.goal", GOALS, v.goal)}</div>
    <button class="btn" data-a="vocabGo" ${T.busy ? "disabled" : ""}>${v.rows.length ? "重新生成" : "生成词表"}</button>
    ${left && !T.busy ? `<button class="btn ghost" data-a="addAll">全部收进词本（${left} 个）</button>` : ""}${noteHtml()}${output()}`;
}
function talkRow(m, last) {
  if (m.hide) return "";
  if (m.role === "user") return `<div class="bub me"><b lang="ja">${esc(m.content)}</b></div>`;
  let r; try { r = JSON.parse(m.content); } catch { return ""; }
  const f = r.fix && str(r.fix.right) ? r.fix : null;
  const say2 = t => soundBtn(plain(t));
  const fix = f ? `<div class="fix"><small>你写的</small><p lang="ja">${esc(str(f.you))}</p>
    <small>更好的说法</small><div class="fix-l"><b lang="ja">${rubyAi(f.right)}</b>${say2(f.right)}</div>
    ${str(f.why) ? `<small>原因</small><p>${esc(f.why)}</p>` : ""}
    ${str(f.native) && plain(f.native) !== plain(f.right) ? `<small>母语者常这样说</small><div class="fix-l"><b lang="ja">${rubyAi(f.native)}</b>${say2(f.native)}</div>` : ""}</div>` : "";
  const hint = last && str(r.hint) ? `<button class="hint" data-a="hint" data-v="${esc(plain(r.hint))}"><small>不知道怎么回？试试</small><b lang="ja">${rubyAi(r.hint)}</b><small>${esc(str(r.hint_zh))}</small></button>` : "";
  return `${fix}<button class="bub" data-a="say" data-v="${esc(plain(str(r.ja)))}"><b lang="ja">${rubyAi(str(r.ja))}</b><small>${esc(str(r.zh))}</small></button>${hint}`;
}
function talkView() {
  const k = T.talk;
  if (!k.log.length) return `<p class="lead">选一个话题开始聊。导师会照顾你学过的内容，纠正错误，并告诉你母语者怎么说。</p>
    <div class="tools">${TOPICS.map(t => `<button class="chip" data-a="topic" data-v="${t}" ${T.busy ? "disabled" : ""}>${t}</button>`).join("")}</div>
    ${form("topicGo", "talk.topic", k.topic, "或者写你想聊的话题", "开始")}${noteHtml()}`;
  const last = k.log.length - 1;
  return `<div class="talk-head"><span>话题：${esc(k.topic)}</span><button class="chip" data-a="talkNew" ${T.busy ? "disabled" : ""}>换个话题</button></div>
    <div class="talk">${k.log.map((m, i) => talkRow(m, i === last)).join("")}
    ${T.busy === "talk" ? `<div class="bub"><span class="think">正在想</span></div><button class="chip stop" data-a="stop">停止</button>` : ""}</div>
    ${noteHtml()}<div class="composer">${form("talkSend", "talk.draft", k.draft, "日语、罗马音或中文都行", "发送")}</div>`;
}
function gramView() {
  const l = LESSONS.filter(x => S.done[x.id]).pop() || LESSONS[0], chips = [...new Set(l.grammar.map(g => g.p))].slice(0, 3);
  return `<p class="lead">贴一个语法点或者一句话，导师用中文讲清楚，给 3 个例子和 1 个要避开的错误。</p>
    ${form("gramGo", "gram.q", T.gram.q, "比如：は和が有什么区别", "讲解")}
    <div class="tools">${chips.map(c => `<button class="chip" data-a="gramAsk" data-v="${esc(c)}" ${T.busy ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>${noteHtml()}${output()}`;
}
function pronView() {
  const p = T.pron;
  return `<p class="lead">输入单词或短语，导师拆开音拍、标出声调，并说明中文母语者容易错在哪里。它听不到你的声音，所以请跟着朗读对比。</p>
    ${form("pronGo", "pron.q", p.q, "比如：学校、ありがとうございます", "拆解")}
    <div class="tools">${SOUNDS.map(c => `<button class="chip" data-a="pronAsk" data-v="${c}" ${T.busy ? "disabled" : ""}>${c}</button>`).join("")}</div>
    ${p.said ? `<div class="tools"><button class="chip" data-a="say" data-v="${esc(p.said)}">听正常速度</button><button class="chip" data-a="slow" data-v="${esc(p.said)}">听慢速</button></div>` : ""}${noteHtml()}${output()}`;
}
function tutorView() {
  const head = `<div class="tools tu-tabs">${TOOLS.map(([k, t]) => `<button class="chip" data-a="tutor" data-v="${k}" aria-pressed="${T.tool === k}">${t}</button>`).join("")}</div>`;
  if (T.ai === "none") return head + `<p class="empty">${esc(T.why)}</p>`;
  const body = { plan: planView, vocab: vocabView, talk: talkView, gram: gramView, pron: pronView }[T.tool]();
  return `${head}<div class="tutor">${body}<p class="tiny">内容由 Claude 实时生成，可能出错，消耗你自己的 Claude 用量。</p></div>`;
}

/* ---------- 对话 ---------- */
const talkRules = () => `你是日语私人导师，正在和一位初学者用日语聊天，话题是「${T.talk.topic}」。
学习者情况：${level()}
规则：
- 每次用 1 到 2 个短句回复，并问一个问题让对话继续。用です・ます体，尽量只用学习者学过的词和语法。
- 学习者用罗马音写的内容当作日语理解，这不算错误。
- 学习者写的日语有错或者不自然，就在 fix 里纠正。没有问题时 fix 为 null。不要挑标点和空格。
- 学习者写中文，说明还不会用日语表达：在 fix 里给出日语说法，you 填那句中文。
- ${FURI}
只回复一个 JSON 对象，值都是字符串：
{"fix":null,"ja":"你的日语回复","zh":"这句回复的中文意思","hint":"学习者下一句可以这样说（日语）","hint_zh":"hint 的中文意思"}
需要纠正时 fix 写成 {"you":"学习者写的原句","right":"正确的说法","why":"用中文说明原因","native":"母语者平时会怎么说"}。`;
function talkEnd() { window.scrollTo(0, document.documentElement.scrollHeight); }
async function talkTurn(text, hide) {
  const k = T.talk;
  k.log.push({ role: "user", content: text, hide });
  const turns = k.log.slice(-24).map(({ role, content }) => ({ role, content }));
  const r = await run("talk", [{ role: "user", content: talkRules() }, ...turns], { modelTier: "quick", cache: false }, true);
  if (r && str(r.ja)) k.log.push({ role: "assistant", content: JSON.stringify(r) });
  else if (r) T.note = RETRY.invalid_json;
  if (k.log.length === 1 && !(r && str(r.ja))) k.log = [];
  saveT(); render(); talkEnd();
  if (r && str(r.ja)) say(plain(r.ja));
}
function talkStart(topic) {
  if (T.busy) return;
  T.talk.topic = topic; T.talk.log = [];
  talkTurn("请开始对话：先打招呼，再问我一个简单的问题。", true);
}

/* ---------- 课程里随时请导师讲 ---------- */
function aiBlock(st, label) {
  if (T.ai === "none") return "";
  return `${st.ai ? "" : `<button class="ask" data-a="teach">${label}</button>`}<div class="rich teach" id="ses-ai">${st.ai ? rich(st.ai) : ""}</div>`;
}
function teachPrompt(st) {
  const who = `我的情况：${level()}`;
  if (st.k === "kcard") { const n = KN[st.it.key], t = st.it.set === "h" ? n.pic : n.kpic; return `${who}\n请教我这个假名：${st.it.ch}，读 ${st.it.ro}。书上的助记是：${t}\n我会普通话、粤语和英语。用中文像老师当面教一样讲：怎么发音（可以借这三种语言）、一个更好记的画面、一个例词。不超过 120 字。${FMT}`; }
  if (st.k === "word") return `${who}\n请教我这个日语词：${st.w[0]}，读音 ${st.w[1]}，意思是${st.w[2]}。像老师当面教一样，用中文讲：怎么读准、什么时候用、和相近的词怎么区分（没有就不写），再给 2 个很简单的例句。总共不超过 120 字。${FMT}`;
  if (st.k === "gteach") return `${who}\n我没听懂这个语法：${st.g.t}。课本的说明是：${st.g.note}\n请用更简单的中文和生活里的例子重新讲一遍，不超过 150 字，再给 2 个例句，例句里的汉字用括号注假名。`;
  if (st.k === "rule") return `${who}\n我没听懂这个语法：${st.g.p}。课本的说明是：${st.g.note}\n请用更简单的中文和生活里的例子重新讲一遍，不超过 150 字，再给 2 个例句。${FMT}`;
  const q = st.q, text = s => s.replace(/<rt>.*?<\/rt>|<[^>]+>/g, "");
  return `${who}\n这道题我不会：${q.label}。题目：${text(q.q || q.listen || "")}。正确答案：${text(q.ans[0].length > 1 || typeof q.ans === "string" ? String(q.ans) : q.ans[0])}。我的答案：${ses.checked.picked ?? "没答"}。\n用中文讲清楚为什么，不超过 120 字，再给 1 个例句。${FMT}`;
}
async function teach() {
  const st = ses.steps[ses.i], box = () => document.getElementById("ses-ai");
  if (T.busy) return toast("导师正在回答，稍等一下");
  if (!sample) return toast(T.ai === "wait" ? "正在连接 Claude，稍等一下" : T.why);
  document.querySelector('[data-a="teach"]')?.remove();
  box().innerHTML = `<p class="think">正在想，第一次要先在弹窗里允许</p>`;
  await run("teach", teachPrompt(st), { onText({ text }) { st.ai = text; if (ses?.steps[ses.i] === st) box().innerHTML = rich(text); } });
  if (T.note) toast(T.note);
  if (T.ai === "none") toast(T.why);
  if (!st.ai && ses?.steps[ses.i] === st) renderSes();
}

/* ---------- 词汇 ---------- */
function addWord(r) {
  const k = "w:" + r.w;
  if (S.srs[k]) return false;
  if (!WORD[k]) S.my[r.w] = [r.w, r.r, r.zh];
  S.srs[k] = { b: 1, due: addDays(today(), 1), at: Date.now() };
  return true;
}
async function vocabGo() {
  const v = T.vocab; let pending = "";
  const eat = line => {
    const t = line.trim();
    if (!t.startsWith("{")) return;
    try {
      const o = JSON.parse(t), r = str(o.r).replace(/[\s、。，？！?!,.・]/g, ""), w = plain(str(o.w)).trim();
      if (w && KANA.test(r) && str(o.zh) && !v.rows.some(x => x.w === w)) v.rows.push({ s: str(o.s) || "常用", w, r, zh: o.zh });
    } catch {}
  };
  v.rows = [];
  await run("vocab", `根据我的目标「${v.goal}」，列出日语中最有用的 100 个单词和短语，按使用场景分组，同一场景里按优先级排序。
我的情况：${level()}不要重复我学过的词。
每行一个 JSON 对象，同一场景的行放在一起，不要任何其他文字，也不要代码块：
{"s":"场景名","w":"日语写法","r":"完整读音，只用假名，不含空格和标点","zh":"中文意思"}`, {
    cache: false,
    onText({ delta }) {
      const lines = (pending + delta).split("\n");
      pending = lines.pop();
      if (lines.length) { lines.forEach(eat); paint(); }
    },
  });
  eat(pending); saveT(); render();
}

/* ---------- 计划、语法、发音 ---------- */
async function planGo() {
  const p = T.plan;
  const r = await run("plan", `扮演我的日语私人导师。评估我当前的水平，并根据我的目标「${p.goal}」制定一份 4 周学习计划。
我的情况：${level()}每天能学 ${p.mins} 分钟，已连续学习 ${streak()} 天。
我在用一套 ${LESSONS.length} 站的课程，通常每天学一站：${LESSONS.map(l => `${l.id} ${l.zh}`).join("、")}。
要求：
- 开头用两三句话评估我的水平。
- 每周一个小标题，写明这周学哪几站、重点场景，以及周末怎么自测。从我还没学的站开始排，时间不够就少排，不要重学已完成的站。
- 课程以外，每天再安排一个和目标相关的小练习，比如和导师对话、查发音。
- 写得短，要能照着做。${FMT}`, { cache: false, onText({ text }) { p.out = text; paint(); } });
  if (r) { S.plan = { goal: p.goal, mins: p.mins, text: r.text, at: Date.now() }; save(); }
  render();
}
async function gramGo() {
  const g = T.gram, q = g.q.trim();
  if (!q) return toast("先写下想问的语法");
  g.out = "";
  await run("gram", `用简单的中文解释这个日语语法：「${q}」。
我的情况：${level()}尽量用我学过的词举例。
结构：
## 一句话讲清楚
## 怎么用
## 3 个例子
## 要避开的错误
最后一节只写 1 个常见错误，错句和正确句子各占一个 > 行，再说明原因。${FMT}`, { onText({ text }) { g.out = text; paint(); } });
  saveT(); render();
}
async function pronGo() {
  const p = T.pron, q = p.q.trim();
  if (!q) return toast("先写下单词或短语");
  p.out = ""; p.said = q.split(/(?<=[ぁ-ヶー])和/)[0];
  await run("pron", `帮我改善「${q}」的日语发音。我是中文母语的初学者。
结构：
## 音拍拆解
用假名逐拍拆开，拍之间用 / 分隔，说明促音、长音、拨音各占一拍。
## 声调
写出东京标准语的高低，用“低高高”这样标。拿不准就直说，不要猜。
## 中文母语者容易错的地方
2 到 3 条，具体到这个词。
## 跟读练习
给 2 个包含它的短句。${FMT}`, { onText({ text }) { p.out = text; paint(); } });
  saveT(); render();
}

Object.assign(ACT, {
  tutor(v) { T.tool = v; T.note = ""; view = "tutor"; render(); window.scrollTo(0, 0); },
  choose(v) { const [path, val] = v.split(":"), [a, b] = path.split("."); T[a][b] = b === "mins" ? +val : val; render(); },
  stop() { T.ctl?.abort(); },
  planGo,
  vocabGo,
  addWord(v) { if (addWord(T.vocab.rows[+v])) { registerMy(); save(); render(); } },
  addAll() {
    const n = T.vocab.rows.filter(addWord).length;
    registerMy(); save(); render();
    toast(`收进 ${n} 个词，明天开始复习`);
  },
  topic: talkStart,
  topicGo() { const t = T.talk.topic.trim(); if (t) talkStart(t); else toast("先选一个话题"); },
  talkNew() { T.talk.log = []; T.talk.topic = ""; T.note = ""; saveT(); render(); },
  hint(v) { T.talk.draft = v; render(); document.querySelector(".composer input")?.focus(); },
  talkSend() {
    const k = T.talk, t = k.draft.trim();
    if (!t || T.busy) return;
    k.draft = "";
    talkTurn(t);
  },
  gramGo,
  gramAsk(v) { T.gram.q = v; gramGo(); },
  askGram(v) { T.tool = "gram"; view = "tutor"; T.gram.q = v; window.scrollTo(0, 0); gramGo(); },
  pronGo,
  pronAsk(v) { T.pron.q = v; pronGo(); },
  slow(v) { say(v, true); },
  teach,
});
document.addEventListener("submit", e => { e.preventDefault(); ACT[e.target.dataset.f]?.(); });
document.addEventListener("input", e => {
  const b = e.target.dataset.b;
  if (b) { const [x, y] = b.split("."); T[x][y] = e.target.value; }
});

async function initAi() {
  if (PWA || !window.claude || !window.claude.use) { T.ai = "none"; T.why = "导师功能需要在 Claude 里登录后打开。"; return; }
  sample = await window.claude.use("sample");
  T.ai = sample ? "ok" : "none";
  if (!sample) T.why = "这里连不上 Claude，导师功能暂时用不了。";
  if (view === "tutor" && !ses) render();
}

loadT();
registerMy();
render();
initSync().finally(applyFreeze);
initAi();
initPwa();
</script>
</body>
</html>
